<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menú Principal</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background: linear-gradient(135deg, #bbdefb, #90caf9); /* Gradiente azul claro */
            }
        </style>
    </head>
    <body class="flex items-center justify-center h-screen">
        <!-- Contenedor principal -->
        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[90%] max-w-lg text-center">
            <!-- Imagen superior -->
            <div class="mb-8 flex justify-center">
                <img th:src="@{/images/escudo.png}" alt="Escudo" class="w-28 h-28 object-contain"> <!-- Tamaño ligeramente mayor -->
            </div>

            <!-- Título -->
            <h1 class="text-3xl font-extrabold text-blue-700 mb-10">Menú Principal</h1>

            <!-- Botones de navegación -->
            <div class="grid grid-cols-2 gap-6">
                <a href="/calendario" class="block py-3 px-5 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold rounded-xl text-base shadow hover:from-blue-600 hover:to-blue-700 hover:shadow-lg transition-all">
                    Calendario
                </a>
                <a href="#" class="block py-3 px-5 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold rounded-xl text-base shadow hover:from-blue-600 hover:to-blue-700 hover:shadow-lg transition-all">
                    Horario
                </a>
                <a href="#" class="block py-3 px-5 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold rounded-xl text-base shadow hover:from-blue-600 hover:to-blue-700 hover:shadow-lg transition-all">
                    Convocatoria
                </a>
                <a href="#" class="block py-3 px-5 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold rounded-xl text-base shadow hover:from-blue-600 hover:to-blue-700 hover:shadow-lg transition-all">
                    Resultados
                </a>
                <a href="#" class="block py-3 px-5 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold rounded-xl text-base shadow hover:from-blue-600 hover:to-blue-700 hover:shadow-lg transition-all">
                    Equipos
                </a>
                <a href="#" class="block py-3 px-5 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold rounded-xl text-base shadow hover:from-blue-600 hover:to-blue-700 hover:shadow-lg transition-all">
                    Más
                </a>
            </div>

            <!-- Pie de página -->
            <div class="mt-8 text-sm text-gray-500">
                <p>© 2024 Tennis ERP.</p>
            </div>
        </div>
    </body>
</html>
