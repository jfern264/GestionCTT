<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menú Principal</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background: linear-gradient(135deg, #007fff, #00c2ff); /* Gradiente azul vibrante */
                font-family: 'Inter', sans-serif; /* Fuente más moderna */
            }
        </style>
    </head>
    <body class="flex items-center justify-center h-screen">
        <!-- Contenedor principal -->
        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[90%] max-w-lg text-center transform transition-transform hover:scale-105">

            <!-- Imagen superior -->
            <div class="mb-8 flex justify-center">
                <img th:src="@{/images/escudo.png}" alt="Escudo" class="w-28 h-28 object-contain"> <!-- Tamaño ligeramente mayor -->
            </div>

            <!-- Título -->
            <h1 class="text-4xl font-extrabold text-blue-700 mb-10 tracking-tight">Menú Principal</h1>

            <!-- Botones de navegación -->
            <div class="grid grid-cols-2 gap-6">
                <a href="/calendario" class="block py-3 px-5 bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold rounded-xl text-lg shadow hover:from-blue-600 hover:to-cyan-600 hover:shadow-lg transition-all">
                    Calendario
                </a>
                <a href="" class="block py-3 px-5 bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold rounded-xl text-lg shadow hover:from-purple-600 hover:to-indigo-600 hover:shadow-lg transition-all">
                    Horario
                </a>
                <a href="" class="block py-3 px-5 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold rounded-xl text-lg shadow hover:from-green-600 hover:to-emerald-600 hover:shadow-lg transition-all">
                    Convocatoria
                </a>
                <a href="/trabajadores" class="block py-3 px-5 bg-gradient-to-r from-orange-500 to-yellow-500 text-white font-bold rounded-xl text-lg shadow hover:from-orange-600 hover:to-yellow-600 hover:shadow-lg transition-all">
                    Trabajadores
                </a>
                <a href="" class="block py-3 px-5 bg-gradient-to-r from-pink-500 to-red-500 text-white font-bold rounded-xl text-lg shadow hover:from-pink-600 hover:to-red-600 hover:shadow-lg transition-all">
                    Equipos
                </a>
                <a href="/jugadores" class="block py-3 px-5 bg-gradient-to-r from-teal-500 to-cyan-600 text-white font-bold rounded-xl text-lg shadow hover:from-teal-600 hover:to-cyan-700 hover:shadow-lg transition-all">
                    Jugadores
                </a>
            </div>

            <!-- Contenedor del botón de Logout centrado -->
            <div class="mt-8 flex justify-center">
                <a href="/logout" class="block py-3 px-5 bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold rounded-xl text-lg shadow hover:from-red-600 hover:to-pink-600 hover:shadow-lg transition-all w-full max-w-xs">
                    Logout
                </a>
            </div>

            <!-- Pie de página -->
            <div class="mt-10 text-sm text-gray-500">
                <p>© 2024 Tennis ERP.</p>
            </div>
        </div>
    </body>
</html>
