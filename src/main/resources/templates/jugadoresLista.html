<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Jugadores</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            function filtrarJugadores() {
                const filtro = document.getElementById("buscador").value.toLowerCase();
                const filas = document.querySelectorAll("tbody tr");

                filas.forEach(fila => {
                    const textoFila = fila.textContent.toLowerCase();
                    fila.style.display = textoFila.includes(filtro) ? "" : "none";
                });
            }

            function ordenarJugadores() {
                const criterio = document.getElementById("orden").value;
                const tbody = document.querySelector("tbody");
                const filas = Array.from(tbody.querySelectorAll("tr"));

                filas.sort((a, b) => {
                    const valorA = a.querySelector(`[data-orden="${criterio}"]`).textContent.trim().toLowerCase();
                    const valorB = b.querySelector(`[data-orden="${criterio}"]`).textContent.trim().toLowerCase();
                    return valorA.localeCompare(valorB);
                });

                tbody.innerHTML = "";
                filas.forEach(f => tbody.appendChild(f));
            }
        </script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen py-10 px-4 font-sans">

        <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl p-8">

            <!-- Top bar -->
            <div class="flex justify-between items-center mb-6">
                <a href="/menu_admin"
                   class="py-2 px-4 bg-gray-500 text-white font-bold rounded-lg text-sm hover:bg-gray-600">
                    ← Atrás
                </a>

                <a href="/menuAdmin/jugadores/nuevo"
                   class="py-2 px-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-semibold rounded-lg hover:from-green-600 hover:to-emerald-600 shadow">
                    + Nuevo Jugador
                </a>
            </div>

            <h1 class="text-3xl font-bold text-blue-700 text-center mb-6">Gestión de Jugadores</h1>

            <!-- Buscador y orden -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <input type="text" id="buscador" onkeyup="filtrarJugadores()" placeholder="Buscar jugador..."
                       class="w-full md:w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:border-blue-300" />

                <select id="orden" onchange="ordenarJugadores()"
                        class="w-full md:w-1/3 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:border-blue-300">
                    <option value="nombre">Ordenar por Nombre</option>
                    <option value="apellido">Ordenar por Apellido</option>
                    <option value="email">Ordenar por Email</option>
                </select>
            </div>

            <!-- Tabla -->
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left border-separate border-spacing-y-2">
                    <thead class="bg-blue-100 text-gray-700 rounded-lg">
                        <tr>
                            <th class="py-3 px-4 rounded-l-lg">ID</th>
                            <th class="py-3 px-4">Nombre completo</th>
                            <th class="py-3 px-4">DNI</th>
                            <th class="py-3 px-4">Teléfono</th>
                            <th class="py-3 px-4">Email</th>
                            <th class="py-3 px-4">Pago</th>
                            <th class="py-3 px-4 rounded-r-lg text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="jugador : ${jugadores}" class="bg-white shadow-md hover:shadow-lg transition rounded-lg">
                            <td class="py-2 px-4 rounded-l-lg" th:text="${jugador.id}"></td>
                            <td class="py-2 px-4" data-orden="nombre"
                                th:text="${jugador.nombre + ' ' + jugador.primerApellido + ' ' + jugador.segundoApellido}"></td>
                            <td class="py-2 px-4" th:text="${jugador.dni}"></td>
                            <td class="py-2 px-4" th:text="${jugador.telefono}"></td>
                            <td class="py-2 px-4" data-orden="email" th:text="${jugador.email}"></td>
                            <td class="py-2 px-4" th:text="${jugador.formaDePago}"></td>
                            <td class="py-2 px-4 rounded-r-lg text-center space-y-1">
                                <a th:href="@{'/menuAdmin/jugadores/editar/' + ${jugador.id}}"
                                   class="inline-block w-full text-center py-1 px-3 bg-yellow-400 text-white rounded hover:bg-yellow-500 transition">Editar</a>
                                <a th:href="@{'/menuAdmin/jugadores/eliminar/' + ${jugador.id}}"
                                   onclick="return confirm('¿Estás seguro que deseas eliminar este jugador?')"
                                   class="inline-block w-full text-center py-1 px-3 bg-red-500 text-white rounded hover:bg-red-600 transition">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </body>
</html>
