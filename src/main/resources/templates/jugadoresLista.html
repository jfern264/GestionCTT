<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Jugadores</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen flex items-center justify-center font-sans">

        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[95%] max-w-5xl text-center">

            <h1 class="text-4xl font-bold text-blue-700 mb-8">Gestión de Jugadores</h1>

            <!-- Botón de nuevo jugador -->
            <div class="mb-6 text-right">
                <a href="/menuAdmin/jugadores/nuevo"
                   class="btn inline-block py-2 px-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-semibold rounded-lg hover:from-green-600 hover:to-emerald-600 shadow">
                    + Nuevo Jugador
                </a>
            </div>

            <!-- Tabla de jugadores -->
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left border-separate border-spacing-y-2">
                    <thead class="bg-blue-100 text-gray-700 rounded-lg">
                        <tr>
                            <th class="py-3 px-4 rounded-l-lg">ID</th>
                            <th class="py-3 px-4">Nombre completo</th>
                            <th class="py-3 px-4">DNI</th>
                            <th class="py-3 px-4">Teléfono</th>
                            <th class="py-3 px-4">Email</th>
                            <th class="py-3 px-4">Pago</th>
                            <th class="py-3 px-4 rounded-r-lg text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="jugador : ${jugadores}" class="bg-white shadow-md hover:shadow-lg transition rounded-lg">
                            <td class="py-2 px-4 rounded-l-lg" th:text="${jugador.id}"></td>
                            <td class="py-2 px-4" 
                                th:text="${jugador.nombre + ' ' + jugador.primerApellido + ' ' + jugador.segundoApellido}"></td>
                            <td class="py-2 px-4" th:text="${jugador.dni}"></td>
                            <td class="py-2 px-4" th:text="${jugador.telefono}"></td>
                            <td class="py-2 px-4" th:text="${jugador.email}"></td>
                            <td class="py-2 px-4" th:text="${jugador.formaDePago}"></td>
                            <td class="py-2 px-4 rounded-r-lg text-center space-y-1">
                                <a th:href="@{'/menuAdmin/jugadores/editar/' + ${jugador.id}}"
                                   class="inline-block w-full text-center py-1 px-3 bg-yellow-400 text-white rounded hover:bg-yellow-500 transition">Editar</a>
                                <a th:href="@{'/menuAdmin/jugadores/eliminar/' + ${jugador.id}}"
                                   onclick="return confirm('¿Estás seguro que deseas eliminar este jugador?')"
                                   class="inline-block w-full text-center py-1 px-3 bg-red-500 text-white rounded hover:bg-red-600 transition">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <!-- Botón Atrás -->
            <div class="mt-8">
                <a href="/menu_admin"
                   class="btn block py-2 px-4 bg-gray-500 text-white font-bold rounded-lg text-sm hover:bg-gray-600 inline-block">
                    Atrás
                </a>
            </div>

        </div>
    </body>
</html>
