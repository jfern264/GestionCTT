<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrar Roles</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen flex items-center justify-center font-sans">
<div class="bg-white rounded-3xl shadow-2xl p-10 w-[95%] max-w-4xl">
    <h1 class="text-3xl font-bold text-blue-700 mb-6 text-center">Gestión de Roles</h1>

    <div class="mb-6 text-right">
        <a href="/menuAdmin/roles/nuevo" class="py-2 px-4 bg-green-500 text-white rounded hover:bg-green-600">
            + Nuevo Rol
        </a>
    </div>

    <div class="overflow-x-auto">
        <table class="min-w-full text-left text-sm border rounded-lg">
            <thead class="bg-blue-100">
            <tr>
                <th class="py-3 px-6">ID</th>
                <th class="py-3 px-6">Nombre del Rol</th>
                <th class="py-3 px-6">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rol : ${roles}" class="border-b hover:bg-gray-100 transition">
                <td class="py-3 px-6" th:text="${rol.id}"></td>
                <td class="py-3 px-6" th:text="${rol.nombreRol}"></td>
                <td class="py-3 px-6">
                    <a th:href="@{'/menuAdmin/roles/eliminar/' + ${rol.id}}"
                       onclick="return confirm('¿Eliminar este rol?')"
                       class="py-1 px-3 bg-red-500 text-white rounded hover:bg-red-600">
                        Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-8">
        <a href="/menu_admin" class="py-2 px-4 bg-gray-500 text-white rounded hover:bg-gray-600">Atrás</a>
    </div>
</div>
</body>
</html>
