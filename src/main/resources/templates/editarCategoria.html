<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoría</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            color: #17a2b8;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1em;
            border: 2px solid #17a2b8;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #138496;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            width: 48%;
            transition: background-color 0.3s ease-in-out;
            color: #ffffff;
        }

        .btn-save {
            background-color: #17a2b8;
        }

        .btn-save:hover {
            background-color: #138496;
        }

        .btn-cancel {
            background-color: #dc3545;
        }

        .btn-cancel:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Editar Categoría</h1>
    <form th:action="@{/editCategoria}" method="post" th:object="${categoria}">
        <!-- Campo oculto para el ID de la categoría -->
        <input type="hidden" name="id" th:field="*{id}">

        <!-- Campo para el nombre -->
        <label for="nombre">Nombre de la Categoría</label>
        <input type="text" id="nombre" name="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre" required>

        <div class="btn-container">
            <button type="submit" class="btn btn-save">Guardar</button>
            <a href="/categorias" class="btn btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
