<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Equipos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        .recuadro {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }

        .titulo {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .detalle {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lista de Equipos</h1>
        <div th:each="equipo : ${equipos}" class="recuadro">
            <div class="titulo" th:text="${equipo.equipo}"></div>
            <div class="detalle"><strong>Liga:</strong> <span th:text="${equipo.liga}"></span></div>
            <div class="detalle"><strong>Categoría:</strong> <span th:text="${equipo.categoria}"></span></div>
            <div class="detalle"><strong>Puntos:</strong> <span th:text="${equipo.puntos}"></span></div>
            <div class="detalle"><strong>Partidos Jugados:</strong> <span th:text="${equipo.partidos}"></span></div>
            <div class="detalle"><strong>Objetivo:</strong> <span th:text="${equipo.objetivo}"></span></div>
            <div class="detalle"><strong>Precio Liga:</strong> <span th:text="${equipo.precioLiga}"></span></div>
        </div>
    </div>
</body>
</html>
