<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Equipos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            text-align: left;
            padding: 10px;
        }

        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }

        td {
            background-color: #fafafa;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lista de Equipos</h1>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Equipo</th>
                    <th>Liga</th>
                    <th>Categoría</th>
                    <th>Puntos</th>
                    <th>Partidos</th>
                    <th>Objetivo</th>
                    <th>Precio Liga</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td th:text="${equipo.nombre}"></td>
                    <td th:text="${equipo.equipo}"></td>
                    <td th:text="${equipo.liga}"></td>
                    <td th:text="${equipo.categoria}"></td>
                    <td th:text="${equipo.puntos}"></td>
                    <td th:text="${equipo.partidos}"></td>
                    <td th:text="${equipo.objetivo}"></td>
                    <td th:text="${equipo.precioLiga}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
