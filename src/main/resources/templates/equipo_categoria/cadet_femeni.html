<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Equipos - Cadet Femení</title>
    <style>
        /* Estilo general unificado */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #ccc;
            border-radius: 12px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            font-size: 1em;
            border: 1px solid #ccc;
            color: #000;
        }

        th {
            background-color: #007bff;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #e0e0e0;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-container {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            text-decoration: none;
            transition: background-color 0.3s ease-in-out, border 0.3s ease-in-out;
            color: #ffffff;
        }

        .btn-back {
            background-color: #17a2b8;
            border: 2px solid #138496;
        }

        .btn-back:hover {
            background-color: #138496;
            border-color: #0f6d75;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lista de Equipos - Cadet Femení</h1>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Jugadores</th>
                        <th>Liga</th>
                        <th>Categoría</th>
                        <th>Puntos</th>
                        <th>Partidos</th>
                        <th>Objetivo</th>
                        <th>Precio Liga</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="equipo : ${equipos}">
                        <td th:text="${equipo.jugadores}"></td>
                        <td th:text="${equipo.liga}"></td>
                        <td th:text="${equipo.categoria.nombre}"></td>
                        <td th:text="${equipo.puntos}"></td>
                        <td th:text="${equipo.partidos}"></td>
                        <td th:text="${equipo.objetivo}"></td>
                        <td th:text="${equipo.precioLiga}"></td>
                    </tr>
                </tbody>

            </table>
        </div>

        <div class="btn-container">
            <a href="/equipos" class="btn btn-back">Atrás</a>
        </div>
    </div>
</body>
</html>
