<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Trabajador</title>
        <style>
            /* Estilos generales */
            body {
                margin: 0;
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #007bff, #00c6ff);
                color: #ffffff;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 0;
                box-sizing: border-box;
            }

            .container {
                width: 100%;
                max-width: 500px;
                background-color: #ffffff;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            h1 {
                text-align: center;
                color: #007bff;
                margin-bottom: 30px;
                font-size: 2.5em;
                font-weight: 600;
            }

            label {
                font-size: 1.1em;
                font-weight: bold;
                color: #007bff;
                margin-top: 15px;
                display: block;
            }

            input, button {
                width: 100%;
                padding: 12px;
                margin-top: 10px;
                border-radius: 8px;
                border: 1px solid #007bff;
                font-size: 1.1em;
                background-color: #f8f9fa;
            }

            input:focus, button:focus {
                outline: none;
                border-color: #00c6ff;
                background-color: #e9ecef;
            }

            button {
                background-color: #28a745;
                color: white;
                font-weight: bold;
                cursor: pointer;
                border: none;
                transition: background-color 0.3s ease;
                margin-top: 20px; /* Este margen se aplica solo al primer botón */
            }

            button:hover {
                background-color: #218838;
            }

            .btn-back {
                background-color: #17a2b8;
                color: white;
                text-align: center;
                font-weight: bold;
                text-decoration: none;
                padding: 14px;
                border-radius: 8px;
                margin-top: 10px; /* Ajustar el margen para que los botones estén pegados */
                display: block;
                transition: background-color 0.3s ease;
            }

            .btn-back:hover {
                background-color: #138496;
            }

            /* Estilo para los mensajes de error */
            .alert {
                background-color: #f8d7da;
                color: #721c24;
                padding: 10px;
                border-radius: 8px;
                margin-top: 15px;
                display: none;
            }

        </style>
    </head>
    <body>

        <div class="container">
            <h1>Editar Trabajador</h1>

            <!-- Mensaje de error (si aplica) -->
            <div class="alert" id="error-msg">
                <strong>¡Error!</strong> Hubo un problema al guardar los datos.
            </div>

            <!-- Formulario de edición -->
            <form th:action="@{/editTrabajador/{id}(id=${trabajador.id})}" method="post">

                <!-- Campo ID (oculto) -->
                <input type="hidden" name="id" th:value="${trabajador.id}">

                <!-- Campo Nombre -->
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" th:value="${trabajador.nombre}" required>

                <!-- Campo Apellidos -->
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" th:value="${trabajador.apellidos}" required>

                <!-- Campo DNI -->
                <label for="dni">DNI</label>
                <input type="text" id="dni" name="dni" th:value="${trabajador.dni}" required>

                <!-- Campo Correo -->
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" th:value="${trabajador.correo}" required>

                <!-- Botón para guardar cambios -->
                <button type="submit">Guardar Cambios</button>

            </form>

            <!-- Botón para volver al menú -->
            <a href="/admintrabajadores" class="btn-back">Volver a trabajadores</a>
        </div>

    </body>
</html>
