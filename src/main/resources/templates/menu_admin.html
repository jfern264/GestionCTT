<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #007fff, #00c2ff); /* Gradiente azul vibrante */
            font-family: 'Inter', sans-serif; /* Fuente más moderna */
        }
        .btn {
            transition: transform 0.3s ease-in-out;
        }
        .btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

    <!-- Contenedor principal -->
    <div class="bg-white rounded-3xl shadow-2xl p-10 w-[90%] max-w-lg text-center">

        <!-- Imagen superior -->
        <div class="mb-8 flex justify-center">
            <img src="/images/escudo.png" alt="Escudo" class="w-28 h-28 object-contain">
        </div>

        <!-- Título -->
        <h1 class="text-4xl font-extrabold text-blue-700 mb-10 tracking-tight">Administrar</h1>

        <!-- Botones de navegación -->
        <div class="grid grid-cols-1 gap-6">
            <a href="/administrar_equipos" class="btn block py-3 px-5 bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold rounded-xl text-lg shadow hover:from-blue-600 hover:to-cyan-600 hover:shadow-lg">
                Administrar Equipos
            </a>
            <a href="/administrar_jugadores" class="btn block py-3 px-5 bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold rounded-xl text-lg shadow hover:from-purple-600 hover:to-indigo-600 hover:shadow-lg">
                Administrar Jugadores
            </a>
        </div>

        <!-- Botón de "Atrás" -->
        <div class="mt-6">
            <a href="/menu_principal" class="btn block py-2 px-4 bg-gray-500 text-white font-bold rounded-lg text-sm shadow hover:bg-gray-600">
                Atrás
            </a>
        </div>

        <!-- Pie de página -->
        <div class="mt-10 text-sm text-gray-500">
            <p>© 2024 Tennis ERP.</p>
        </div>

    </div>

</body>
</html>
