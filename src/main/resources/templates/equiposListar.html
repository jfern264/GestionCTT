<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Administrar Equipos</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen py-10 px-4">

        <div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-2xl p-8">
            <h1 class="text-4xl font-bold text-blue-700 mb-6 text-center">Administrar Equipos</h1>

            <div th:each="liga : ${ligas}" class="mb-12 border-b pb-6">
                <!-- Fila de liga -->
                <div class="flex justify-between items-center bg-blue-100 p-4 rounded-lg mb-4">
                    <h2 class="text-2xl font-semibold text-blue-800" th:text="${liga.nombre}">Nombre Liga</h2>
                </div>

                <!-- Categorías en tarjetas -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div th:each="categoria : ${liga.categorias}" class="bg-gray-100 p-4 rounded-lg shadow">
                        <div class="flex justify-between items-center mb-2">
                            <div>
                                <h3 class="text-lg font-bold text-blue-700" th:text="${categoria.nombre}">Nombre Categoría</h3>
                                <p class="text-sm text-gray-700" th:text="${categoria.descripcion}">Descripción</p>
                            </div>
                            <a th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/editar'}"
                               class="py-1 px-3 bg-yellow-500 text-white rounded hover:bg-yellow-600 text-sm">
                                ✏️ Editar
                            </a>
                        </div>

                        <!-- Lista de jugadores -->
                        <div th:if="${#lists.isEmpty(categoria.usuarioCategorias)}">
                            <p class="text-sm italic text-gray-500 mt-2">Sin jugadores asignados</p>
                        </div>

                        <div th:if="${!#lists.isEmpty(categoria.usuarioCategorias)}">
                            <table class="w-full text-sm mt-2 border border-gray-300">
                                <thead class="bg-gray-200 text-gray-600">
                                    <tr>
                                        <th class="px-3 py-2 text-left">Jugador</th>
                                        <th class="px-2 py-2 text-center">Activo</th>
                                        <th class="px-2 py-2 text-center">Suplente</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Filas de jugadores activos -->
                                    <tr th:each="uc : ${categoria.usuarioCategorias}"
                                        th:if="${uc.activo}"
                                        class="bg-green-50">
                                        <td class="border px-3 py-2"
                                            th:text="${uc.usuario.nombre + ' ' + uc.usuario.primerApellido}">Nombre</td>
                                        <td class="border px-2 py-2 text-center">✔️</td>
                                        <td class="border px-2 py-2 text-center">-</td>
                                    </tr>

                                    <!-- Separador si existen activos y suplentes -->
                                    <tr th:if="${categoria.usuarioCategorias.?[activo].size() > 0 
                                                and categoria.usuarioCategorias.?[!activo].size() > 0}">
                                        <td colspan="3" class="h-2"></td>
                                    </tr>

                                    <!-- Filas de jugadores suplentes -->
                                    <tr th:each="uc : ${categoria.usuarioCategorias}"
                                        th:if="${!uc.activo}"
                                        class="bg-yellow-50">
                                        <td class="border px-3 py-2"
                                            th:text="${uc.usuario.nombre + ' ' + uc.usuario.primerApellido}">Nombre</td>
                                        <td class="border px-2 py-2 text-center">-</td>
                                        <td class="border px-2 py-2 text-center">✔️</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6 text-center">
                <a href="/menu_admin"
                   class="py-2 px-4 bg-gray-500 text-white rounded-lg hover:bg-gray-600 text-sm">
                    Volver al Menú Admin
                </a>
            </div>
        </div>

    </body>
</html>
