<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Añadir Jugador a Categoría</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen py-10 px-4">

<div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-2xl p-8">
    <h1 class="text-3xl font-bold text-blue-700 mb-6 text-center">
        Añadir Jugador a <span th:text="${categoria.nombre}">Categoría</span>
    </h1>

    <!-- Si no hay jugadores disponibles -->
    <div th:if="${#lists.isEmpty(jugadoresDisponibles)}">
        <p class="text-center text-gray-600 italic">
            No hay jugadores disponibles para asignar en esta categoría.
        </p>
        <div class="mt-6 text-center">
            <a th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/editar'}"
               class="py-2 px-4 bg-gray-500 text-white rounded hover:bg-gray-600 text-sm">
                ← Volver al Equipo
            </a>
        </div>
    </div>

    <!-- Si existen jugadores disponibles -->
    <div th:if="${!#lists.isEmpty(jugadoresDisponibles)}">
        <!-- Filtros por franja de edad -->
        <div class="mb-6">
            <p class="font-semibold text-gray-700 mb-2">Filtrar por franja de edad:</p>
            <div class="flex flex-wrap gap-4">
                <label th:each="franja : ${franjasEdad}"
                       class="inline-flex items-center space-x-2">
                    <input type="checkbox"
                           th:id="${'chk_' + franja.nombre}"
                           th:data-edad-min="${franja.edadMin}"
                           th:data-edad-max="${franja.edadMax}"
                           class="franja-checkbox form-checkbox h-5 w-5 text-blue-600" />
                    <span class="text-gray-800" th:text="${franja.nombre}">Nombre Franja</span>
                </label>
            </div>
        </div>

        <!-- Lista de jugadores disponibles -->
        <div id="listaJugadores" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="jugador-card bg-white p-4 rounded-lg shadow flex justify-between items-center"
                 th:each="jugador : ${jugadoresDisponibles}"
                 th:attr="data-edad=${jugador.edad}">
                <div>
                    <p class="font-semibold text-gray-800"
                       th:text="${jugador.nombre + ' ' + jugador.primerApellido + ' ' + jugador.segundoApellido}">
                        Nombre Completo
                    </p>
                    <p class="text-sm text-gray-600"
                       th:text="${jugador.edad + ' años (' + jugador.fechaNacimiento + ')'}">
                        Edad y fecha
                    </p>
                </div>
                <form th:action="@{'/menuAdmin/equipos/' + ${categoria.id} + '/añadir-jugador'}"
                      method="post">
                    <input type="hidden" name="usuarioId" th:value="${jugador.id}" />
                    <button type="submit"
                            class="py-1 px-4 bg-green-600 text-white rounded hover:bg-green-700 text-sm">
                        Añadir
                    </button>
                </form>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/editar'}"
               class="py-2 px-4 bg-gray-500 text-white rounded hover:bg-gray-600 text-sm">
                ← Volver al Equipo
            </a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const checkboxes = document.querySelectorAll('.franja-checkbox');
        const jugadorCards = document.querySelectorAll('.jugador-card');

        function filtrarJugadores() {
            // Obtener todas las franjas seleccionadas
            const franjasSeleccionadas = Array.from(checkboxes)
                .filter(chk => chk.checked)
                .map(chk => ({
                    min: parseInt(chk.dataset.edadMin),
                    max: parseInt(chk.dataset.edadMax)
                }));

            jugadorCards.forEach(card => {
                const edad = parseInt(card.dataset.edad);
                // Si no hay franjas seleccionadas, mostramos todos
                if (franjasSeleccionadas.length === 0) {
                    card.style.display = '';
                    return;
                }
                // Verificar si la edad entra en alguna franja seleccionada
                const entra = franjasSeleccionadas.some(f => edad >= f.min && edad <= f.max);
                card.style.display = entra ? '' : 'none';
            });
        }

        // Agregar listener a cada checkbox
        checkboxes.forEach(chk => {
            chk.addEventListener('change', filtrarJugadores);
        });
    });
</script>

</body>
</html>
