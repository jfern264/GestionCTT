<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Categorías de [[${liga.nombre}]]</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen flex items-center justify-center font-sans">

        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[95%] max-w-5xl text-center">

            <h1 class="text-4xl font-bold text-blue-700 mb-8">Categorías de <span th:text="${liga.nombre}"></span></h1>

            <!-- Botón nueva categoría -->
            <div class="mb-6 text-right">
                <a th:href="@{'/menuAdmin/ligas/categorias/nueva/' + ${liga.id}}"
                   class="btn inline-block py-2 px-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-semibold rounded-lg hover:from-green-600 hover:to-emerald-600 shadow">
                    + Nueva Categoría
                </a>
            </div>

            <!-- Tabla de categorías -->
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm border rounded-lg">
                    <thead class="bg-blue-100">
                        <tr>
                            <th class="py-3 px-6">ID</th>
                            <th class="py-3 px-6">Nombre</th>
                            <th class="py-3 px-6">Descripción</th>
                            <th class="py-3 px-6">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="categoria : ${categorias}" class="border-b hover:bg-gray-100 transition">
                            <td class="py-3 px-6" th:text="${categoria.id}"></td>
                            <td class="py-3 px-6" th:text="${categoria.nombre}"></td>
                            <td class="py-3 px-6" th:text="${categoria.descripcion}"></td>
                            <td class="py-3 px-6 space-x-2">
                                <a th:href="@{'/menuAdmin/ligas/categorias/editar/' + ${categoria.id}}"
                                   class="py-1 px-3 bg-yellow-400 text-white rounded hover:bg-yellow-500">Editar</a>
                                <a th:href="@{'/menuAdmin/ligas/categorias/eliminar/' + ${categoria.id}}"
                                   onclick="return confirm('¿Estás seguro de eliminar esta categoría?')"
                                   class="py-1 px-3 bg-red-500 text-white rounded hover:bg-red-600">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Botón Atrás -->
            <div class="mt-8">
                <a href="/menuAdmin/ligas"
                   class="btn block py-2 px-4 bg-gray-500 text-white font-bold rounded-lg text-sm hover:bg-gray-600 inline-block">
                    Volver a Ligas
                </a>
            </div>

        </div>
    </body>
</html>
