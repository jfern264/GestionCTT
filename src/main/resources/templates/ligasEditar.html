<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Editar Liga</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen flex items-center justify-center font-sans">

        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[95%] max-w-3xl">

            <h1 class="text-3xl font-bold text-blue-700 mb-6 text-center">Editar Liga</h1>

            <form th:action="@{'/menuAdmin/ligas/actualizar/' + ${liga.id}}" th:object="${liga}" method="post" class="grid grid-cols-1 gap-6">

                <div>
                    <label class="block font-semibold text-gray-700">Nombre *</label>
                    <input th:field="*{nombre}" class="w-full p-2 border rounded-md" required>
                    <p class="text-red-500 text-sm" th:errors="*{nombre}"></p>
                </div>

                <div class="flex justify-between">
                    <a href="/menuAdmin/ligas"
                       class="py-2 px-4 bg-gray-500 text-white rounded-md hover:bg-gray-600">Cancelar</a>
                    <button type="submit"
                            class="py-2 px-6 bg-blue-600 text-white rounded-md hover:bg-blue-700">Actualizar</button>
                </div>
            </form>

        </div>
    </body>
</html>
