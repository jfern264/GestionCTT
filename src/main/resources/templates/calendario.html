<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendario</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background-color: #F3F4F6;
                font-family: 'Arial', sans-serif;
                margin: 0;
            }
            table {
                width: 100%;
                table-layout: fixed;
            }
            td, th {
                text-align: center;
                vertical-align: top;
                padding: 8px;
                height: 100px;
            }
            td {
                transition: all 0.3s ease;
            }
            td:hover {
                transform: scale(1.05);
            }
            .evento-1 {
                background-color: #BFDBFE;
            }
            .evento-2 {
                background-color: #BBF7D0;
            }
            .evento-3 {
                background-color: #FECACA;
            }
            .vacio {
                background-color: #F9FAFB;
            }
        </style>
    </head>
    <body class="flex flex-col">
        <header class="bg-blue-600 text-white py-4 text-center shadow-md">
            <h1 class="text-4xl font-extrabold">Calendario</h1>
            <button onclick="volverAlMenu()" class="bg-red-600 text-white py-3 px-8 rounded-full mt-6 hover:bg-red-700 hover:shadow-lg transform transition duration-300 ease-in-out mx-auto block text-xl font-semibold tracking-wide focus:outline-none focus:ring-4 focus:ring-red-500">
                Volver al Menú Principal
            </button>
        </header>

        <div class="flex justify-between items-center px-6 py-4 bg-white shadow-sm">
            <button class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" onclick="cambiarMes(-1)">Anterior</button>
            <h2 id="mes-actual" class="text-2xl font-bold text-blue-600"></h2>
            <button class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" onclick="cambiarMes(1)">Siguiente</button>
        </div>

        <main class="flex-grow bg-gray-100 px-4 py-6">
            <table class="table-auto w-full text-gray-800 border-separate border-spacing-2">
                <thead>
                    <tr class="bg-blue-100 text-blue-600">
                        <th class="py-2 rounded">Lunes</th>
                        <th class="py-2 rounded">Martes</th>
                        <th class="py-2 rounded">Miércoles</th>
                        <th class="py-2 rounded">Jueves</th>
                        <th class="py-2 rounded">Viernes</th>
                        <th class="py-2 rounded">Sábado</th>
                        <th class="py-2 rounded">Domingo</th>
                    </tr>
                </thead>
                <tbody id="tabla-calendario" class="bg-white shadow-md"></tbody>
            </table>
        </main>

        <section class="bg-white px-6 py-6 shadow-md mt-4">
            <h2 class="text-xl font-bold text-blue-500 mb-4">Agregar Evento</h2>
            <form onsubmit="event.preventDefault(); agregarEvento();" class="space-y-4">
                <div>
                    <label for="fecha" class="block text-left font-semibold">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                </div>

                <div>
                    <label for="hora" class="block text-left font-semibold">Hora:</label>
                    <input type="time" id="hora" name="hora" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label for="titulo" class="block text-left font-semibold">Título:</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Título del evento" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label for="descripcion" class="block text-left font-semibold">Descripción:</label>
                    <input type="text" id="descripcion" name="descripcion" placeholder="Descripción del evento" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                </div>
                <button type="submit" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600">Agregar</button>
            </form>
        </section>

        <div id="modal" class="hidden fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-75 z-50">
            <div class="bg-white rounded-lg p-4 w-80 sm:w-96 max-w-sm shadow-lg">
                <h2 id="modal-titulo" class="text-lg font-semibold text-blue-600 mb-4 text-center">Detalles del Evento</h2>
                <form id="form-editar-evento" class="space-y-2">
                    <table class="table-auto w-full text-gray-700">
                        <tbody>
                            <tr class="border-b">
                                <td class="font-semibold py-1 px-4 text-left">Fecha:</td>
                                <td class="py-1 px-4 text-right">
                                    <input type="date" id="modal-fecha" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500">
                                </td>
                            </tr>
                            <tr class="border-b">
                                <td class="font-semibold py-1 px-4 text-left">Hora:</td>
                                <td class="py-1 px-4 text-right">
                                    <input type="time" id="modal-hora" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500">
                                </td>
                            </tr>
                            <tr>
                                <td class="font-semibold py-1 px-4 text-left">Descripción:</td>
                                <td class="py-1 px-4 text-right">
                                    <input type="text" id="modal-descripcion" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500" placeholder="Descripción del evento">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="flex justify-end mt-4 space-x-2">
                        <button type="button" onclick="cerrarModal()" class="bg-gray-400 text-white py-2 px-4 rounded-lg hover:bg-gray-500">Cerrar</button>
                        <button id="eliminar-evento" type="button" class="bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600">Eliminar</button>
                        <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            let fechaActual = new Date();
            let eventos = JSON.parse(localStorage.getItem('calendarioEventos')) || [];

            function renderizarCalendario() {
                const mes = fechaActual.getMonth();
                const anio = fechaActual.getFullYear();

                document.getElementById("mes-actual").textContent = `${meses[mes]} ${anio}`;

                const primerDia = new Date(anio, mes, 1).getDay();
                const diasEnMes = new Date(anio, mes + 1, 0).getDate();

                const primerDiaSemana = primerDia === 0 ? 6 : primerDia - 1;
                const tabla = document.getElementById("tabla-calendario");
                tabla.innerHTML = "";

                let fila = document.createElement("tr");
                for (let i = 0; i < primerDiaSemana; i++) {
                    const celda = document.createElement("td");
                    celda.classList.add("vacio");
                    fila.appendChild(celda);
                }

                for (let dia = 1; dia <= diasEnMes; dia++) {
                    if (fila.children.length === 7) {
                        tabla.appendChild(fila);
                        fila = document.createElement("tr");
                    }

                    const celda = document.createElement("td");
                    celda.classList.add("border", "p-2", "rounded-lg");
                    const eventosDelDia = eventos.filter(evento => {
                        const fechaEvento = new Date(evento.date);
                        return fechaEvento.getDate() === dia && fechaEvento.getMonth() === mes && fechaEvento.getFullYear() === anio;
                    });

                    celda.innerHTML = `<p>${dia}</p>`;
                    eventosDelDia.forEach(evento => {
                        const eventoTitulo = document.createElement("p");
                        eventoTitulo.textContent = evento.title;
                        eventoTitulo.classList.add("text-blue-600", "cursor-pointer", "hover:underline");
                        eventoTitulo.onclick = () => mostrarDetallesEvento(evento);
                        celda.appendChild(eventoTitulo);
                    });

                    if (eventosDelDia.length === 1) {
                        celda.classList.add("evento-1");
                    } else if (eventosDelDia.length === 2) {
                        celda.classList.add("evento-2");
                    } else if (eventosDelDia.length >= 3) {
                        celda.classList.add("evento-3");
                    }

                    fila.appendChild(celda);
                }

                while (fila.children.length < 7) {
                    const celda = document.createElement("td");
                    celda.classList.add("vacio");
                    fila.appendChild(celda);
                }
                tabla.appendChild(fila);
            }

            function mostrarDetallesEvento(evento) {
                document.getElementById("modal-titulo").textContent = evento.title;
                document.getElementById("modal-fecha").value = evento.date;
                document.getElementById("modal-hora").value = evento.time;
                document.getElementById("modal-descripcion").value = evento.description;

                document.getElementById("form-editar-evento").onsubmit = function (event) {
                    event.preventDefault();
                    evento.date = document.getElementById("modal-fecha").value;
                    evento.time = document.getElementById("modal-hora").value;
                    evento.description = document.getElementById("modal-descripcion").value;

                    localStorage.setItem("calendarioEventos", JSON.stringify(eventos));
                    cerrarModal();
                    renderizarCalendario();
                };

                document.getElementById("modal").classList.remove("hidden");

                const botonEliminar = document.getElementById("eliminar-evento");
                botonEliminar.onclick = () => eliminarEvento(evento);
            }

            function eliminarEvento(evento) {
                eventos = eventos.filter(e => e.date !== evento.date || e.title !== evento.title || e.description !== evento.description);
                localStorage.setItem("calendarioEventos", JSON.stringify(eventos));
                cerrarModal();
                renderizarCalendario();
            }

            function cerrarModal() {
                document.getElementById("modal").classList.add("hidden");
            }

            function cambiarMes(incremento) {
                fechaActual.setMonth(fechaActual.getMonth() + incremento);
                renderizarCalendario();
            }

            function agregarEvento() {
                const fecha = document.getElementById("fecha").value;
                const hora = document.getElementById("hora").value;
                const titulo = document.getElementById("titulo").value;
                const descripcion = document.getElementById("descripcion").value;

                if (fecha && hora && titulo && descripcion) {
                    eventos.push({date: fecha, time: hora, title: titulo, description: descripcion});
                    localStorage.setItem("calendarioEventos", JSON.stringify(eventos));
                    renderizarCalendario();
                    document.getElementById("fecha").value = '';
                    document.getElementById("hora").value = '';
                    document.getElementById("titulo").value = '';
                    document.getElementById("descripcion").value = '';
                }
            }

            function volverAlMenu() {
                window.location.href = "menu_principal"; // Reemplazar con la URL de tu menú principal
            }

            renderizarCalendario();
        </script>
    </body>
</html>
