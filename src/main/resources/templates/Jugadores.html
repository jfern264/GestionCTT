<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Jugadores</title>
        <style>
            /* General styles */
            body {
                margin: 0;
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #007bff, #00c6ff);
                color: #ffffff;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh; /* Hace que ocupe toda la altura de la ventana */
                flex-direction: column;
                padding: 0;
                box-sizing: border-box;
            }

            .container {
                width: 100%;
                height: 100%;
                max-width: 1200px;
                background-color: #ffffff;
                padding: 20px;
                border-radius: 12px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            h1 {
                text-align: center;
                color: #007bff;
                margin-bottom: 30px;
                font-size: 2.5em;
                font-weight: 600;
            }

            .table-wrapper {
                overflow-x: auto;
                margin-top: 20px;
                border-radius: 12px;
                background-color: #f5f5f5;
                padding: 10px;
                flex: 1; /* Para que ocupe el espacio restante */
            }

            table {
                width: 100%;
                border-collapse: collapse;
                border-radius: 12px;
            }

            th, td {
                padding: 12px;
                text-align: center;
                font-size: 1em;
            }

            th {
                background-color: #007bff;
                color: #ffffff;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            tr:hover {
                background-color: #e0e0e0;
                transition: background-color 0.2s ease-in-out;
            }

            td {
                color: #007bff;
                font-weight: 500;
            }

            .action-buttons a {
                text-decoration: none;
                padding: 6px 14px;
                margin: 0 8px;
                border-radius: 6px;
                font-weight: bold;
                text-transform: uppercase;
                font-size: 0.9em;
                transition: background-color 0.3s ease-in-out;
            }

            .action-buttons a:nth-child(1) {
                background-color: #ffc107;
                color: #007bff;
            }

            .action-buttons a:nth-child(1):hover {
                background-color: #e0a800;
            }

            .action-buttons a:nth-child(2) {
                background-color: #dc3545;
                color: #ffffff;
            }

            .action-buttons a:nth-child(2):hover {
                background-color: #c82333;
            }

            .btn-container {
                text-align: center;
                margin-top: 20px;
                flex-shrink: 0; /* Evita que el contenedor de botones se colapse */
            }

            .btn {
                display: inline-block;
                padding: 12px 24px;
                margin: 10px;
                font-size: 1.1em;
                font-weight: bold;
                border-radius: 8px;
                text-transform: uppercase;
                text-decoration: none;
                transition: background-color 0.3s ease-in-out;
                color: #ffffff;
            }

            .btn-add {
                background-color: #28a745;
            }

            .btn-add:hover {
                background-color: #218838;
            }

            .btn-back {
                background-color: #17a2b8;
            }

            .btn-back:hover {
                background-color: #138496;
            }
        </style>
    </head>
    <body>

        <div class="container">
            <h1>Lista de Jugadores</h1>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>DNI</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Iterar sobre la lista de jugadores -->
                        <tr th:each="jugador : ${jugadores}">
                            <td th:text="${jugador.id}"></td>
                            <td th:text="${jugador.nombre}"></td>
                            <td th:text="${jugador.apellidos}"></td>
                            <td th:text="${jugador.dni}"></td>
                            <td class="action-buttons">
                                
                                <a th:href="@{/deleteJugador/{id}(id=${jugador.id})}" 
                                   onclick="return confirm('¿Estás seguro de que deseas eliminar este jugador?')">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="btn-container">
                <a href="/menu_principal" class="btn btn-back">Volver al Menú</a>
                <a href="/addJugador" class="btn btn-add">Añadir Nuevo Jugador</a>
            </div>
        </div>
    </body>
</html>
