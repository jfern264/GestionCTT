<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Entrenadores</title>
    <style>
        /* General styles */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 12px;
            background-color: #f5f5f5;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            font-size: 1em;
        }

        th {
            background-color: #007bff;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #e0e0e0;
            transition: background-color 0.2s ease-in-out;
        }

        td {
            color: #007bff;
            font-weight: 500;
        }

        .action-buttons a {
            text-decoration: none;
            padding: 6px 14px;
            margin: 0 8px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9em;
            transition: background-color 0.3s ease-in-out;
        }

        .action-buttons a:nth-child(1) {
            background-color: #ffc107;
            color: #007bff;
        }

        .action-buttons a:nth-child(1):hover {
            background-color: #e0a800;
        }

        .action-buttons a:nth-child(2) {
            background-color: #dc3545;
            color: #ffffff;
        }

        .action-buttons a:nth-child(2):hover {
            background-color: #c82333;
        }

        .btn-container {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            text-decoration: none;
            transition: background-color 0.3s ease-in-out;
            color: #ffffff;
        }

        .btn-add {
            background-color: #28a745;
        }

        .btn-add:hover {
            background-color: #218838;
        }

        .btn-back {
            background-color: #17a2b8;
        }

        .btn-back:hover {
            background-color: #138496;
        }

        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .search-container input {
            padding: 10px 15px;
            width: 80%;
            font-size: 1.1em;
            border: 2px solid #007bff;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-container input:focus {
            border-color: #00c6ff;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Administrar Entrenadores</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar por nombre...">
    </div>
    <div class="table-wrapper">
        <table id="entrenadorTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entrenador : ${entrenadores}">
                    <td th:text="${entrenador.id}"></td>
                    <td th:text="${entrenador.nombre}"></td>
                    <td th:text="${entrenador.apellido}"></td>
                    <td th:text="${entrenador.DNI}"></td>
                    <td class="action-buttons">
                       <a th:href="@{/entrenadores/editar/{id}(id=${entrenador.id})}" class="btn-edit">Editar</a>
                       <a th:href="@{/entrenadores/eliminar/{id}(id=${entrenador.id})}" 
                           onclick="return confirm('¿Estás seguro de eliminar este entrenador?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="btn-container">
        <a href="/menu_admin" class="btn btn-back">Volver al Menú</a>
       <a th:href="@{/entrenadores/add}" class="btn btn-add">Agregar Entrenador</a>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');
        const entrenadorTable = document.querySelector('#entrenadorTable tbody');
        const rows = Array.from(entrenadorTable.querySelectorAll('tr'));

        function filterRows() {
            const term = searchInput.value.toLowerCase();
            rows.forEach(row => {
                const nombre = row.cells[1].textContent.toLowerCase();
                row.style.display = nombre.includes(term) ? '' : 'none';
            });
        }

        searchInput.addEventListener('input', filterRows);
    });
</script>
</body>
</html>
