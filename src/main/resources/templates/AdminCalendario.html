<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendario</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background-color: #F3F4F6;
                font-family: 'Arial', sans-serif;
                margin: 0;
            }
            table {
                width: 100%;
                table-layout: fixed;
            }
            td, th {
                text-align: center;
                vertical-align: top;
                padding: 8px;
                height: 100px;
            }
            td {
                transition: all 0.3s ease;
            }
            td:hover {
                transform: scale(1.05);
            }
            .evento-1 {
                background-color: #BFDBFE;
            }
            .evento-2 {
                background-color: #BBF7D0;
            }
            .evento-3 {
                background-color: #FECACA;
            }
            .vacio {
                background-color: #F9FAFB;
            }
        </style>
    </head>
    <body class="flex flex-col">
        <header class="bg-blue-600 text-white py-4 text-center shadow-md">
            <h1 class="text-4xl font-extrabold">Administrar Calendario</h1>
            <button onclick="volver()" class="bg-red-600 text-white py-3 px-8 rounded-full mt-6 hover:bg-red-700 hover:shadow-lg transform transition duration-300 ease-in-out mx-auto block text-xl font-semibold tracking-wide focus:outline-none focus:ring-4 focus:ring-red-500">
                Volver
            </button>
        </header>

        <div class="flex justify-between items-center px-6 py-4 bg-white shadow-sm">
            <button class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" onclick="cambiarMes(-1)">Anterior</button>
            <h2 id="mes-actual" class="text-2xl font-bold text-blue-600"></h2>
            <button class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" onclick="cambiarMes(1)">Siguiente</button>
        </div>

        <main class="flex-grow bg-gray-100 px-4 py-6">
            <table class="table-auto w-full text-gray-800 border-separate border-spacing-2">
                <thead>
                    <tr class="bg-blue-100 text-blue-600">
                        <th class="py-2 rounded">Lunes</th>
                        <th class="py-2 rounded">Martes</th>
                        <th class="py-2 rounded">Miércoles</th>
                        <th class="py-2 rounded">Jueves</th>
                        <th class="py-2 rounded">Viernes</th>
                        <th class="py-2 rounded">Sábado</th>
                        <th class="py-2 rounded">Domingo</th>
                    </tr>
                </thead>
                <tbody id="tabla-calendario" class="bg-white shadow-md"></tbody>
            </table>
        </main>

        <section class="bg-white px-6 py-6 shadow-md mt-4">
            <h2 class="text-xl font-bold text-blue-500 mb-4">Agregar Evento</h2>
            <form onsubmit="event.preventDefault(); agregarEvento();" class="space-y-4">
                <div>
                    <label for="fecha" class="block text-left font-semibold">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                </div>

                <div>
                    <label for="hora" class="block text-left font-semibold">Hora:</label>
                    <input type="time" id="hora" name="hora" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label for="titulo" class="block text-left font-semibold">Título:</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Título del evento" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label for="descripcion" class="block text-left font-semibold">Descripción:</label>
                    <input type="text" id="descripcion" name="descripcion" placeholder="Descripción del evento" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                </div>

                <div>
                    <label for="pista" class="block text-left font-semibold">Pista:</label>
                    <select id="pista" name="pista" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                        <!-- Iteramos sobre las pistas enviadas desde el backend -->
                        <th:block th:each="pista : ${pistas}">
                            <option th:value="${pista.id}" th:text="${pista.nombrePista}"></option>
                        </th:block>
                    </select>
                </div>

                <button type="submit" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600">Agregar</button>
            </form>
        </section>

        <!-- Modal para mostrar los detalles del evento -->
        <div id="modal" class="hidden fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-75 z-50">
            <div class="bg-white rounded-lg p-4 w-80 sm:w-96 max-w-sm shadow-lg">
                <h2 id="modal-titulo" class="text-lg font-semibold text-blue-600 mb-4 text-center">Detalles del Evento</h2>
                <form onsubmit="event.preventDefault(); editarEvento();" class="space-y-4" id="form-editar-evento">
                    <div>
                        <label for="modal-fecha" class="block text-left font-semibold">Fecha:</label>
                        <input type="date" id="modal-fecha" name="fecha" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                    </div>

                    <div>
                        <label for="modal-hora" class="block text-left font-semibold">Hora:</label>
                        <input type="time" id="modal-hora" name="hora" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                    </div>

                    <div>
                        <label for="modal-titulo" class="block text-left font-semibold">Título:</label>
                        <input type="text" id="modal-titulo" name="titulo" placeholder="Título del evento" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                    </div>

                    <div>
                        <label for="modal-descripcion" class="block text-left font-semibold">Descripción:</label>
                        <input type="text" id="modal-descripcion" name="descripcion" placeholder="Descripción del evento" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                    </div>

                    <div>
                        <label for="modal-pista" class="block text-left font-semibold">Pista:</label>
                        <select id="modal-pista" name="pista" required class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-400">
                            <!-- Aquí puedes iterar sobre las pistas y cargarlas si es necesario -->
                            <th:block th:each="pista : ${pistas}">
                                <option th:value="${pista.id}" th:text="${pista.nombrePista}"></option>
                            </th:block>
                        </select>
                    </div>

                    <button type="button" id="eliminar-evento" class="bg-red-600 text-white font-semibold py-2 px-4 rounded hover:bg-red-700">Eliminar Evento</button>
                    <button type="submit" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600">Guardar cambios</button>

                </form>
            </div>
        </div>

        <script>
            const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            let fechaActual = new Date();
            let eventos = JSON.parse(localStorage.getItem('calendarioEventos')) || [];

            function renderizarCalendario() {
                const mes = fechaActual.getMonth();
                const anio = fechaActual.getFullYear();

                document.getElementById("mes-actual").textContent = `${meses[mes]} ${anio}`;

                const primerDia = new Date(anio, mes, 1).getDay();
                const diasEnMes = new Date(anio, mes + 1, 0).getDate();

                const primerDiaSemana = primerDia === 0 ? 6 : primerDia - 1;
                const tabla = document.getElementById("tabla-calendario");
                tabla.innerHTML = "";

                let fila = document.createElement("tr");
                for (let i = 0; i < primerDiaSemana; i++) {
                    const celda = document.createElement("td");
                    celda.classList.add("vacio");
                    fila.appendChild(celda);
                }

                for (let dia = 1; dia <= diasEnMes; dia++) {
                    if (fila.children.length === 7) {
                        tabla.appendChild(fila);
                        fila = document.createElement("tr");
                    }

                    const celda = document.createElement("td");
                    celda.classList.add("border", "p-2", "rounded-lg");
                    const eventosDelDia = eventos.filter(evento => {
                        const fechaEvento = new Date(evento.date);
                        return fechaEvento.getDate() === dia && fechaEvento.getMonth() === mes && fechaEvento.getFullYear() === anio;
                    });

                    celda.innerHTML = `<p>${dia}</p>`;
                    eventosDelDia.forEach(evento => {
                        const eventoTitulo = document.createElement("p");
                        eventoTitulo.textContent = evento.title;
                        eventoTitulo.classList.add("text-blue-600", "cursor-pointer", "hover:underline");
                        eventoTitulo.onclick = () => mostrarDetallesEvento(evento);
                        celda.appendChild(eventoTitulo);
                    });

                    if (eventosDelDia.length === 1) {
                        celda.classList.add("evento-1");
                    } else if (eventosDelDia.length === 2) {
                        celda.classList.add("evento-2");
                    } else if (eventosDelDia.length >= 3) {
                        celda.classList.add("evento-3");
                    }

                    fila.appendChild(celda);
                }

                while (fila.children.length < 7) {
                    const celda = document.createElement("td");
                    celda.classList.add("vacio");
                    fila.appendChild(celda);
                }
                tabla.appendChild(fila);
            }

            function mostrarDetallesEvento(evento) {
                // Mostrar detalles en el modal
                document.getElementById("modal-titulo").value = evento.title;
                document.getElementById("modal-descripcion").value = evento.description;
                document.getElementById("modal-fecha").value = evento.date;
                document.getElementById("modal-hora").value = evento.time;

                // Asignamos la pista previamente seleccionada en el evento
                const pistaSelect = document.getElementById("modal-pista");
                pistaSelect.value = evento.pistaId;

                // Mostrar el modal
                document.getElementById("modal").classList.remove("hidden");

                // Guardar evento con cambios
                const botonGuardar = document.getElementById("form-editar-evento");
                botonGuardar.onsubmit = function (event) {
                    event.preventDefault();
                    evento.title = document.getElementById("modal-titulo").value;
                    evento.description = document.getElementById("modal-descripcion").value;
                    evento.date = document.getElementById("modal-fecha").value;
                    evento.time = document.getElementById("modal-hora").value;
                    evento.pistaId = document.getElementById("modal-pista").value;

                    localStorage.setItem("calendarioEventos", JSON.stringify(eventos));
                    cerrarModal();
                    renderizarCalendario();
                };

                // Vincular el botón de eliminar al evento
                const botonEliminar = document.getElementById("eliminar-evento");
                botonEliminar.onclick = function () {
                    eliminarEvento(evento);
                };
            }


            function eliminarEvento(evento) {
                // Filtrar el evento por su id
                eventos = eventos.filter(e => e.id !== evento.id);
                localStorage.setItem("calendarioEventos", JSON.stringify(eventos));
                cerrarModal();
                renderizarCalendario();
            }


            function cerrarModal() {
                document.getElementById("modal").classList.add("hidden");
            }

            function cambiarMes(incremento) {
                fechaActual.setMonth(fechaActual.getMonth() + incremento);
                renderizarCalendario();
            }

            function agregarEvento() {
                const fecha = document.getElementById("fecha").value;
                const hora = document.getElementById("hora").value;
                const titulo = document.getElementById("titulo").value;
                const descripcion = document.getElementById("descripcion").value;
                const pista = document.getElementById("pista").value;

                if (fecha && hora && titulo && descripcion && pista) {
                    // Guardamos el evento incluyendo la pista
                    eventos.push({date: fecha, time: hora, title: titulo, description: descripcion, pistaId: pista});
                    localStorage.setItem("calendarioEventos", JSON.stringify(eventos));
                    renderizarCalendario();
                    document.getElementById("fecha").value = '';
                    document.getElementById("hora").value = '';
                    document.getElementById("titulo").value = '';
                    document.getElementById("descripcion").value = '';
                    document.getElementById("pista").value = ''; // Reiniciar el campo pista
                }
            }


            function volver() {
                window.location.href = "menu_admin";
            }

            renderizarCalendario();
        </script>
    </body>
</html>
