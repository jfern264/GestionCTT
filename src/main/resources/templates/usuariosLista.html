<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Gestión de Usuarios</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen flex items-center justify-center font-sans">

        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[95%] max-w-6xl text-center">

            <!-- Header y botón atrás -->
            <div class="flex justify-between items-center mb-8">
                <a href="/menu_admin"
                   class="py-2 px-4 bg-gray-500 text-white font-bold rounded-lg text-sm hover:bg-gray-600">
                    ← Atrás
                </a>
                <h1 class="text-4xl font-bold text-blue-700">Gestión de Usuarios</h1>
                <a href="/menuAdmin/usuarios/nuevo"
                   class="py-2 px-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-semibold rounded-lg hover:from-green-600 hover:to-emerald-600 shadow">
                    + Nuevo Usuario
                </a>
            </div>

            <!-- Buscador y orden -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <input type="text" id="buscador" placeholder="Buscar por nombre, apellido o email..."
                       class="w-full md:w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />

                <select id="ordenSelect"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="">Ordenar por...</option>
                    <option value="nombre">Nombre</option>
                    <option value="apellido">Apellido</option>
                    <option value="email">Email</option>
                </select>
            </div>

            <!-- Tabla -->
            <div class="overflow-x-auto">
                <table id="tablaUsuarios" class="min-w-full text-left text-sm border rounded-lg">
                    <thead class="bg-blue-100">
                        <tr>
                            <th class="py-3 px-6">ID</th>
                            <th class="py-3 px-6">Nombre Completo</th>
                            <th class="py-3 px-6">Email</th>
                            <th class="py-3 px-6">Roles</th>
                            <th class="py-3 px-6">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usuariosBody">
                        <tr th:each="usuario : ${usuarios}" class="border-b hover:bg-gray-100 transition">
                            <td class="py-3 px-6" th:text="${usuario.id}"></td>
                            <td class="py-3 px-6 nombreCompleto"
                                th:text="${usuario.nombre + ' ' + usuario.primerApellido + ' ' + usuario.segundoApellido}"></td>
                            <td class="py-3 px-6 email" th:text="${usuario.email}"></td>
                            <td class="py-3 px-6">
                                <span th:each="rol, rolStat : ${usuario.roles}" th:text="${rol.nombreRol}"
                                      th:append="${!rolStat.last} ? ', ' : ''"></span>
                            </td>
                            <td class="py-3 px-6 space-x-2 whitespace-nowrap">
                                <a th:href="@{'/menuAdmin/usuarios/editar/' + ${usuario.id}}"
                                   class="inline-block py-1 px-3 bg-yellow-400 text-white rounded hover:bg-yellow-500">Editar</a>
                                <a th:href="@{'/menuAdmin/usuarios/eliminar/' + ${usuario.id}}"
                                   onclick="return confirm('¿Estás seguro?')"
                                   class="inline-block py-1 px-3 bg-red-500 text-white rounded hover:bg-red-600">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

        <script>
            const buscador = document.getElementById('buscador');
            const ordenSelect = document.getElementById('ordenSelect');
            const tablaBody = document.getElementById('usuariosBody');

            buscador.addEventListener('input', () => {
                const filtro = buscador.value.toLowerCase();
                const filas = tablaBody.querySelectorAll('tr');
                filas.forEach(fila => {
                    const nombre = fila.querySelector('.nombreCompleto')?.textContent.toLowerCase() || '';
                    const email = fila.querySelector('.email')?.textContent.toLowerCase() || '';
                    fila.style.display = nombre.includes(filtro) || email.includes(filtro) ? '' : 'none';
                });
            });

            ordenSelect.addEventListener('change', () => {
                const tipo = ordenSelect.value;
                const filas = Array.from(tablaBody.querySelectorAll('tr'));

                const obtenerClave = (fila) => {
                    if (tipo === 'nombre')
                        return fila.querySelector('.nombreCompleto')?.textContent.toLowerCase();
                    if (tipo === 'apellido') {
                        const nombreCompleto = fila.querySelector('.nombreCompleto')?.textContent.toLowerCase().split(' ');
                        return nombreCompleto?.[1] || '';
                    }
                    if (tipo === 'email')
                        return fila.querySelector('.email')?.textContent.toLowerCase();
                    return '';
                };

                filas.sort((a, b) => {
                    const valA = obtenerClave(a);
                    const valB = obtenerClave(b);
                    return valA.localeCompare(valB);
                });

                filas.forEach(fila => tablaBody.appendChild(fila));
            });
        </script>

    </body>
</html>
