<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Eventos</title>
 <style>
    /* VARIABLES DE MARCA (Basadas en tu primer estilo) */
    :root {
        --ctt-verde: #1a4731;   
        --ctt-verde-claro: #2d5a27;
        --ctt-arcilla: #cc5233; 
        --ctt-blanco: #ffffff;
        --ctt-gris-suave: #edf2f0;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Montserrat', sans-serif; /* Cambiado a Montserrat */
        background-color: var(--ctt-verde);
        background-image: radial-gradient(var(--ctt-verde-claro) 1px, transparent 1px);
        background-size: 30px 30px;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .container {
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        background: var(--ctt-blanco);
        border-radius: 40px; /* Bordes redondeados como el main-wrapper */
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        animation: fadeInScale 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    /* HEADER DEL CALENDARIO */
    .header {
        background: var(--ctt-verde); /* Color corporativo */
        color: white;
        padding: 40px;
        text-align: center;
        border-bottom: 5px solid var(--ctt-arcilla); /* Acento en arcilla */
    }

    .header h1 {
        font-size: 2.2em;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .calendar-wrapper {
        padding: 40px;
    }

    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .month-year {
        font-size: 1.8em;
        font-weight: 800;
        color: var(--ctt-verde);
        text-transform: uppercase;
    }

    /* BOTONES DE NAVEGACIÓN */
    .nav-btn {
        background: var(--ctt-arcilla); /* Botón color arcilla como el submit */
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 15px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        transition: all 0.3s;
        box-shadow: 0 5px 10px rgba(204, 82, 51, 0.2);
    }

    .nav-btn:hover {
        background: #a33f27;
        transform: translateY(-2px);
    }

    /* GRILLA DEL CALENDARIO */
    .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 12px;
    }

    .day-header {
        text-align: center;
        font-weight: 700;
        color: var(--ctt-arcilla);
        padding: 10px;
        text-transform: uppercase;
        font-size: 0.9em;
        letter-spacing: 1px;
    }

    .day-cell {
        min-height: 110px;
        border: 2px solid var(--ctt-gris-suave);
        border-radius: 20px; /* Bordes muy redondeados */
        padding: 12px;
        background: #fff;
        transition: all 0.3s;
    }

    .day-cell:hover {
        border-color: var(--ctt-verde);
        box-shadow: 0 8px 15px rgba(26, 71, 49, 0.1);
        transform: translateY(-3px);
    }

    .day-number {
        font-weight: 700;
        font-size: 1.1em;
        color: var(--ctt-verde);
    }

    .day-cell.other-month {
        opacity: 0.2;
    }

    .day-cell.today {
        background: var(--ctt-gris-suave);
        border: 2px solid var(--ctt-verde);
    }

    /* EVENTOS */
    .event {
        background: var(--ctt-verde);
        color: white;
        padding: 5px 10px;
        margin-top: 6px;
        border-radius: 10px;
        font-size: 0.8em;
        font-weight: 600;
        border-left: 4px solid var(--ctt-arcilla); /* Detalle lateral */
    }

    /* MODAL */
    .modal-content {
        background: white;
        padding: 40px;
        border-radius: 30px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .modal-title {
        font-weight: 800;
        color: var(--ctt-verde);
        text-transform: uppercase;
    }

    .event-detail {
        border-left: 4px solid var(--ctt-arcilla);
        background: var(--ctt-gris-suave);
        border-radius: 15px;
        padding: 15px;
    }

    /* ANIMACIONES */
    @keyframes fadeInScale { 
        from { opacity: 0; transform: scale(0.95); } 
        to { opacity: 1; transform: scale(1); } 
    }

    @media (max-width: 768px) {
        .calendar-wrapper { padding: 15px; }
        .day-cell { min-height: 80px; border-radius: 12px; }
        .header h1 { font-size: 1.5em; }
    }
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7); /* Fondo oscuro detrás */
        z-index: 9999;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px); /* Efecto de desenfoque moderno */
    }

    .modal.active {
        display: flex;
    }

    .modal-content {
        background: var(--ctt-blanco);
        padding: 40px;
        border-radius: 30px;
        max-width: 500px;
        width: 90%;
        position: relative; /* Necesario para posicionar la X */
        box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        animation: fadeInScale 0.4s ease-out;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--ctt-gris-suave);
        padding-bottom: 15px;
    }

    /* ESTILO DE LA X DE CIERRE */
    .close-btn {
        position: absolute;
        top: 20px;
        right: 25px;
        background: none;
        border: none;
        font-size: 32px;
        font-weight: 800;
        cursor: pointer;
        color: var(--ctt-verde); /* Color corporativo */
        line-height: 1;
        transition: color 0.3s, transform 0.3s;
    }

    .close-btn:hover {
        color: var(--ctt-arcilla); /* Cambia a naranja al pasar el mouse */
        transform: scale(1.2);
    }

    .event-detail h3 {
        color: var(--ctt-verde);
        font-weight: 800;
        margin-bottom: 15px;
        text-transform: uppercase;
    }

    .event-detail p {
        margin: 10px 0;
        color: #555;
        line-height: 1.6;
    }

    .event-detail strong {
        color: var(--ctt-verde);
    }
    /* Añade esto a tu bloque de <style> */
    .top-bar {
        display: flex;
        align-items: center;
        padding: 20px 40px 0 40px; /* Ajuste para que no pegue con el borde */
        background: var(--ctt-verde);
    }

    .back-btn {
        background: transparent;
        color: white;
        border: 2px solid var(--ctt-blanco);
        padding: 8px 20px;
        border-radius: 15px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .back-btn:hover {
        background: var(--ctt-blanco);
        color: var(--ctt-verde);
        transform: translateX(-5px);
    }
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <a href="javascript:history.back()" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Volver
        </a>
    </div>

    <div class="header" style="padding-top: 20px;"> <h1>Calendario de Actividades</h1>
    </div>

    <div class="calendar-wrapper">
            <div class="calendar-header">
                <div class="month-year" id="monthYear"></div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="previousMonth()">← Anterior</button>
                    <button class="nav-btn" onclick="nextMonth()">Siguiente →</button>
                </div>
            </div>

            <div class="calendar" id="calendarGrid"></div>
        </div>
    </div>

    <!-- Modal para detalles de eventos -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Detalles de la Actividad</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="eventDetails"></div>
        </div>
    </div>

    <script th:inline="javascript">
        // Datos de eventos desde el servidor
        let eventsData = /*[[${eventosJson}]]*/ '[]';
        let events = [];
        
        try {
            events = typeof eventsData === 'string' ? JSON.parse(eventsData) : eventsData;
            if (!Array.isArray(events)) {
                events = [];
            }
        } catch (e) {
            console.error('Error parsing events:', e);
            events = [];
        }
        
        console.log('Eventos cargados:', events);
        
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        function parseEventDate(dateArray) {
            if (Array.isArray(dateArray)) {
                const [year, month, day] = dateArray;
                return new Date(year, month - 1, day);
            }
            return new Date(dateArray);
        }

        function getEventsForDate(date) {
            if (!events || !Array.isArray(events)) {
                return [];
            }
            return events.filter(event => {
                const eventDate = parseEventDate(event.date);
                return eventDate.getDate() === date.getDate() &&
                       eventDate.getMonth() === date.getMonth() &&
                       eventDate.getFullYear() === date.getFullYear();
            });
        }

        function generateCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const prevLastDay = new Date(currentYear, currentMonth, 0);
            
            const firstDayIndex = (firstDay.getDay() + 6) % 7; // Ajuste para que lunes sea 0
            const lastDayDate = lastDay.getDate();
            const prevLastDayDate = prevLastDay.getDate();
            
            const calendarGrid = document.getElementById('calendarGrid');
            
            let html = `
                <div class="day-header">Lun</div>
                <div class="day-header">Mar</div>
                <div class="day-header">Mié</div>
                <div class="day-header">Jue</div>
                <div class="day-header">Vie</div>
                <div class="day-header">Sáb</div>
                <div class="day-header">Dom</div>
            `;
            
            // Días del mes anterior
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const day = prevLastDayDate - i;
                const date = new Date(currentYear, currentMonth - 1, day);
                html += createDayCell(day, date, true, false);
            }
            
            // Días del mes actual
            for (let day = 1; day <= lastDayDate; day++) {
                const date = new Date(currentYear, currentMonth, day);
                const isToday = date.toDateString() === new Date().toDateString();
                html += createDayCell(day, date, false, isToday);
            }
            
            // Días del mes siguiente
            const remainingCells = 42 - (firstDayIndex + lastDayDate);
            for (let day = 1; day <= remainingCells; day++) {
                const date = new Date(currentYear, currentMonth + 1, day);
                html += createDayCell(day, date, true, false);
            }
            
            calendarGrid.innerHTML = html;
        }

        function createDayCell(day, date, otherMonth, isToday) {
            const dayEvents = getEventsForDate(date);
            let cssClass = 'day-cell';
            if (otherMonth) cssClass += ' other-month';
            if (isToday) cssClass += ' today';
            
            let eventsHtml = '';
            const maxVisible = 2;
            
            dayEvents.slice(0, maxVisible).forEach(event => {
                eventsHtml += `<div class="event" onclick="showEventDetails(${event.id})">${event.title}</div>`;
            });
            
            if (dayEvents.length > maxVisible) {
                eventsHtml += `<div class="event-count">+${dayEvents.length - maxVisible} más</div>`;
            }
            
            return `
                <div class="${cssClass}">
                    <div class="day-number">${day}</div>
                    ${eventsHtml}
                </div>
            `;
        }

        function updateCalendar() {
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                              "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('monthYear').textContent = 
                `${monthNames[currentMonth]} ${currentYear}`;
            generateCalendar();
        }

        function previousMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            updateCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            updateCalendar();
        }

        function showEventDetails(eventId) {
            const event = events.find(e => e.id == eventId);
            if (event) {
                let pistaInfo = event.pista ? 
                    `<p><strong>Pista:</strong> ${event.pista.nombre || 'Pista ' + event.pista.id}</p>` : 
                    '<p><strong>Pista:</strong> No asignada</p>';
                
                const detailsHtml = `
                    <div class="event-detail">
                        <h3>${event.title}</h3>
                        <p><strong>Fecha:</strong> ${formatDate(event.date)}</p>
                        <p><strong>Hora:</strong> ${formatTime(event.time)}</p>
                        <p><strong>Descripción:</strong> ${event.description || 'Sin descripción'}</p>
                        ${pistaInfo}
                    </div>
                `;
                document.getElementById('eventDetails').innerHTML = detailsHtml;
                document.getElementById('eventModal').classList.add('active');
            }
        }

        function formatDate(dateArray) {
            if (Array.isArray(dateArray)) {
                const [year, month, day] = dateArray;
                return `${day.toString().padStart(2, '0')}/${month.toString().padStart(2, '0')}/${year}`;
            }
            return dateArray;
        }

        function formatTime(timeArray) {
            if (Array.isArray(timeArray)) {
                const [hour, minute] = timeArray;
                return `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
            }
            return timeArray || 'No especificada';
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        // Cerrar modal al hacer clic fuera
        document.getElementById('eventModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Inicializar
        updateCalendar();
    </script>
</body>
</html>
