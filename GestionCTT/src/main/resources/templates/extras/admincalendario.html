<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Eventos</title>
    <style>
        :root {
            --ctt-verde: #1a4731; --ctt-verde-claro: #2d5a27;
            --ctt-arcilla: #cc5233; --ctt-blanco: #ffffff; --ctt-gris-suave: #edf2f0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--ctt-verde);
            background-image: radial-gradient(var(--ctt-verde-claro) 1px, transparent 1px);
            background-size: 30px 30px;
            padding: 20px;
            margin: 0;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* FORMULARIO */
        .form-card {
            background: var(--ctt-blanco);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            height: fit-content;
        }

        .form-card h2 { color: var(--ctt-verde); text-transform: uppercase; margin-bottom: 20px; font-size: 1.2em; border-bottom: 3px solid var(--ctt-arcilla); padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 700; color: var(--ctt-verde); margin-bottom: 5px; font-size: 0.85em; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 2px solid var(--ctt-gris-suave); border-radius: 12px; font-family: inherit;
        }

        .btn-save {
            width: 100%; background: var(--ctt-arcilla); color: white; border: none; padding: 15px; border-radius: 15px;
            font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .btn-save:hover { background: #a33f27; transform: translateY(-2px); }

        /* CALENDARIO CONTAINER */
        .calendar-container {
            background: var(--ctt-blanco);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Estilos del calendario */
        .calendar-header { 
            padding: 20px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #fff; 
        }
        
        .month-year { 
            font-size: 1.5em; 
            font-weight: 800; 
            color: var(--ctt-verde); 
            text-transform: uppercase; 
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .nav-btn {
            background: var(--ctt-gris-suave);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 1.2em;
            cursor: pointer;
            color: var(--ctt-verde);
            font-weight: 700;
            transition: 0.3s;
        }
        
        .nav-btn:hover {
            background: var(--ctt-verde-claro);
            color: white;
            transform: translateY(-2px);
        }
        
        .today-btn {
            background-color: var(--ctt-verde);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 10px;
            width: auto;
            height: 40px;
        }
        
        .today-btn:hover {
            background-color: var(--ctt-verde-claro);
            transform: translateY(-2px);
        }
        
        .calendar { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 10px; 
            padding: 0 40px 40px 40px; 
        }
        
        .day-header { 
            text-align: center; 
            font-weight: 700; 
            color: var(--ctt-arcilla); 
            text-transform: uppercase; 
            font-size: 0.8em; 
            padding: 10px 0;
        }
        
        .day-cell { 
            min-height: 100px; 
            border: 2px solid var(--ctt-gris-suave); 
            border-radius: 15px; 
            padding: 10px; 
            transition: 0.3s;
        }
        
        .day-cell:hover {
            border-color: var(--ctt-arcilla);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .day-number { 
            font-weight: 700; 
            color: var(--ctt-verde); 
            margin-bottom: 8px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* ESTILOS PARA EL DÍA DE HOY */
        .day-cell.today {
            background-color: rgba(204, 82, 51, 0.1);
            border: 2px solid var(--ctt-arcilla);
            position: relative;
        }

        .day-cell.today .day-number {
            background-color: var(--ctt-arcilla);
            color: white;
            border-radius: 50%;
        }

        .day-cell.other-month.today {
            opacity: 0.7;
            background-color: rgba(204, 82, 51, 0.05);
            border: 2px dashed var(--ctt-arcilla);
        }
        
        .event { 
            background: var(--ctt-verde); 
            color: white; 
            padding: 4px 8px; 
            border-radius: 8px; 
            font-size: 0.75em; 
            margin-top: 5px; 
            border-left: 3px solid var(--ctt-arcilla); 
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .event:hover {
            background: var(--ctt-arcilla);
            transform: translateX(3px);
        }
        
        .event-count {
            background: var(--ctt-gris-suave);
            color: var(--ctt-verde);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-top: 5px;
            text-align: center;
            font-weight: 700;
        }
        
        .other-month {
            opacity: 0.5;
            background-color: #f9f9f9;
        }

        @media (max-width: 1100px) { 
            .admin-layout { 
                grid-template-columns: 1fr; 
            } 
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; padding: 40px; border-radius: 30px;
            max-width: 500px; width: 90%; position: relative;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 2px solid var(--ctt-gris-suave); padding-bottom: 15px;
        }
        .modal-title {
            color: var(--ctt-verde);
            font-size: 1.5em;
            margin: 0;
        }
        .close-btn { 
            background: none; 
            border: none; 
            font-size: 32px; 
            cursor: pointer; 
            color: var(--ctt-verde);
            transition: 0.3s;
        }
        .close-btn:hover {
            color: var(--ctt-arcilla);
            transform: scale(1.1);
        }
        
        .event-detail {
            padding: 20px 0;
        }
        
        .event-detail h3 {
            color: var(--ctt-arcilla);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3em;
        }
        
        .event-detail p {
            margin: 10px 0;
            color: var(--ctt-verde);
            line-height: 1.6;
        }
        
        .event-detail strong {
            color: var(--ctt-verde-claro);
        }
    </style>
</head>
<body>

    <div style="margin-bottom: 20px;">
        <a href="/menu_admin" style="color: white; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.8em; display: flex; align-items: center; gap: 5px;">
            ← Volver al Panel
        </a>
    </div>

    <div class="admin-layout">
        <div class="form-card">
            <h2>Nueva Actividad</h2>
            <form th:action="@{/menu_admin/calendario/guardar}" th:object="${nuevoEvento}" method="post">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" th:field="*{title}" required>
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" th:field="*{date}" required>
                </div>
                <div class="form-group">
                    <label>Hora</label>
                    <input type="time" th:field="*{time}">
                </div>
                <div class="form-group">
                    <label>Pista</label>
                    <select th:field="*{pista}" required>
                        <option value="">Seleccionar pista...</option>
                        <option th:each="p : ${pistas}" 
                                th:value="${p.id}" 
                                th:text="${p.nombrePista}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea th:field="*{description}" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-save">Publicar Actividad</button>
            </form>
        </div>

        <div class="calendar-container">
            <div class="calendar-header">
                <div class="month-year" id="monthYear"></div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="previousMonth()">←</button>
                    <button class="nav-btn" onclick="nextMonth()">→</button>
                    <button class="nav-btn today-btn" onclick="goToToday()">Hoy</button>
                </div>
            </div>
            <div class="calendar" id="calendarGrid"></div>
        </div>
    </div>
    
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Detalles de la Actividad</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="eventDetails"></div>
        </div>
    </div>

    <script th:inline="javascript">
        // Datos de eventos desde el servidor
        let eventsData = /*[[${eventosJson}]]*/ '[]';
        let events = [];
        
        try {
            events = typeof eventsData === 'string' ? JSON.parse(eventsData) : eventsData;
            if (!Array.isArray(events)) {
                events = [];
            }
        } catch (e) {
            console.error('Error parsing events:', e);
            events = [];
        }
        
        console.log('Eventos cargados:', events);
        
        const today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        function parseEventDate(dateArray) {
            if (Array.isArray(dateArray)) {
                const [year, month, day] = dateArray;
                return new Date(year, month - 1, day);
            }
            return new Date(dateArray);
        }

        function getEventsForDate(date) {
            if (!events || !Array.isArray(events)) {
                return [];
            }
            return events.filter(event => {
                const eventDate = parseEventDate(event.date);
                return eventDate.getDate() === date.getDate() &&
                       eventDate.getMonth() === date.getMonth() &&
                       eventDate.getFullYear() === date.getFullYear();
            });
        }

        function generateCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const prevLastDay = new Date(currentYear, currentMonth, 0);
            
            const firstDayIndex = (firstDay.getDay() + 6) % 7; // Ajuste para que lunes sea 0
            const lastDayDate = lastDay.getDate();
            const prevLastDayDate = prevLastDay.getDate();
            
            const calendarGrid = document.getElementById('calendarGrid');
            
            let html = `
                <div class="day-header">Lun</div>
                <div class="day-header">Mar</div>
                <div class="day-header">Mié</div>
                <div class="day-header">Jue</div>
                <div class="day-header">Vie</div>
                <div class="day-header">Sáb</div>
                <div class="day-header">Dom</div>
            `;
            
            // Días del mes anterior
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const day = prevLastDayDate - i;
                const date = new Date(currentYear, currentMonth - 1, day);
                const isToday = date.toDateString() === today.toDateString();
                html += createDayCell(day, date, true, isToday);
            }
            
            // Días del mes actual
            for (let day = 1; day <= lastDayDate; day++) {
                const date = new Date(currentYear, currentMonth, day);
                const isToday = date.toDateString() === today.toDateString();
                html += createDayCell(day, date, false, isToday);
            }
            
            // Días del mes siguiente
            const remainingCells = 42 - (firstDayIndex + lastDayDate);
            for (let day = 1; day <= remainingCells; day++) {
                const date = new Date(currentYear, currentMonth + 1, day);
                const isToday = date.toDateString() === today.toDateString();
                html += createDayCell(day, date, true, isToday);
            }
            
            calendarGrid.innerHTML = html;
        }

        function createDayCell(day, date, otherMonth, isToday) {
            const dayEvents = getEventsForDate(date);
            let cssClass = 'day-cell';
            if (otherMonth) cssClass += ' other-month';
            if (isToday) cssClass += ' today';
            
            let eventsHtml = '';
            const maxVisible = 2;
            
            dayEvents.slice(0, maxVisible).forEach(event => {
                eventsHtml += `<div class="event" onclick="showEventDetails(${event.id})">${event.title}</div>`;
            });
            
            if (dayEvents.length > maxVisible) {
                eventsHtml += `<div class="event-count">+${dayEvents.length - maxVisible} más</div>`;
            }
            
            return `
                <div class="${cssClass}">
                    <div class="day-number">${day}</div>
                    ${eventsHtml}
                </div>
            `;
        }

        function updateCalendar() {
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                              "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('monthYear').textContent = 
                `${monthNames[currentMonth]} ${currentYear}`;
            generateCalendar();
        }

        function previousMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            updateCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            updateCalendar();
        }
        
        function goToToday() {
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            updateCalendar();
        }

        function showEventDetails(eventId) {
            const event = events.find(e => e.id == eventId);
            if (event) {
                let pistaInfo = event.pista ? 
                    `<p><strong>Pista:</strong> ${event.pista.nombre || 'Pista ' + event.pista.id}</p>` : 
                    '<p><strong>Pista:</strong> No asignada</p>';
                
                const detailsHtml = `
                    <div class="event-detail">
                        <h3>${event.title}</h3>
                        <p><strong>Fecha:</strong> ${formatDate(event.date)}</p>
                        <p><strong>Hora:</strong> ${formatTime(event.time)}</p>
                        <p><strong>Descripción:</strong> ${event.description || 'Sin descripción'}</p>
                        ${pistaInfo}
                    </div>
                `;
                document.getElementById('eventDetails').innerHTML = detailsHtml;
                document.getElementById('eventModal').classList.add('active');
            }
        }

        function formatDate(dateArray) {
            if (Array.isArray(dateArray)) {
                const [year, month, day] = dateArray;
                return `${day.toString().padStart(2, '0')}/${month.toString().padStart(2, '0')}/${year}`;
            }
            return dateArray;
        }

        function formatTime(timeArray) {
            if (Array.isArray(timeArray)) {
                const [hour, minute] = timeArray;
                return `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
            }
            return timeArray || 'No especificada';
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        // Cerrar modal al hacer clic fuera
        document.getElementById('eventModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Inicializar
        updateCalendar();
    </script>

</body>
</html>
