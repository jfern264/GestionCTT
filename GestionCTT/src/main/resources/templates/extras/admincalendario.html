<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Eventos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #0f172a; background-image: radial-gradient(circle at center, #2d3748 0%, #0f172a 100%); display: flex; min-height: 100vh; overflow-y: scroll;}
        .main-content { flex: 1; margin-left: 280px; width: calc(100% - 280px); padding: 40px; }

        :root { --ctt-verde: #1a4731; --ctt-arcilla: #cc5233; --color-perfil: #8b5cf6; --color-calendario: #10b981; --ctt-gris-borde: #475569; --ctt-plata: #94a3b8; }
        .sidebar { width: 280px; background: rgba(0, 0, 0, 0.85); border-right: 3px solid var(--ctt-gris-borde); padding: 30px 0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; backdrop-filter: blur(10px); display: flex; flex-direction: column; box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5); }
        .sidebar-content { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .user-profile-section { padding: 0 25px 25px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; flex-shrink: 0; }
        .user-profile-link { display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; text-decoration: none; transition: 0.3s; }
        .user-profile-link:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--color-perfil); transform: translateY(-2px); }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { color: white; font-weight: 700; font-size: 1rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role-badge { background: rgba(139, 92, 246, 0.2); color: var(--color-perfil); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; padding: 0 20px; flex: 1; }
        .sidebar-link { display: flex; align-items: center; gap: 15px; padding: 16px 20px; color: var(--ctt-plata); text-decoration: none; border-radius: 12px; transition: 0.3s; font-weight: 600; font-size: 0.95rem; }
        .sidebar-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 1; }
        .sidebar-link:hover { color: white; transform: translateX(5px); background: rgba(255, 255, 255, 0.05); }

        .admin-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .form-card { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); height: fit-content; border: 4px solid var(--ctt-gris-borde); }
        .form-card h2 { color: #1a1a1a; text-transform: uppercase; margin-bottom: 20px; font-weight: 900; font-size: 1.2em; border-bottom: 3px solid var(--color-calendario); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 800; color: #475569; margin-bottom: 5px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;}
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-weight: 600; outline: none; transition: 0.3s;}
        .form-group input:focus, .form-group select:focus { border-color: var(--color-calendario); }

        .btn-save { width: 100%; background: var(--color-calendario); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);}
        .btn-save:hover { transform: translateY(-2px); filter: brightness(1.1);}

        .calendar-container { background: white; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 4px solid var(--ctt-gris-borde);}
        .calendar-header { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-bottom: 2px solid #e2e8f0;}
        .month-year { font-size: 1.5em; font-weight: 900; color: #1a1a1a; text-transform: uppercase; }
        
        .nav-buttons { display: flex; gap: 10px; align-items: center; }
        .nav-btn { background: white; border: 2px solid #e2e8f0; width: 40px; height: 40px; border-radius: 12px; font-size: 1.2em; cursor: pointer; color: #475569; font-weight: 700; transition: 0.3s; }
        .nav-btn:hover { background: #f1f5f9; color: #1a1a1a; transform: translateY(-2px); }
        .today-btn { background-color: var(--color-calendario); color: white; border: none; padding: 8px 15px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-left: 10px; width: auto; height: 40px; }
        .today-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 20px 40px 40px 40px; }
        .day-header { text-align: center; font-weight: 800; color: #94a3b8; text-transform: uppercase; font-size: 0.7em; padding: 10px 0; letter-spacing: 1px;}
        .day-cell { min-height: 100px; border: 2px solid #f1f5f9; border-radius: 15px; padding: 10px; transition: 0.3s; cursor: pointer; position: relative;}
        .day-cell:hover { border-color: var(--color-calendario); background-color: #f8fafc; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .day-number { font-weight: 800; color: #1a1a1a; margin-bottom: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;}
        
        .day-cell.today { background-color: #f0fdf4; border: 2px solid var(--color-calendario); }
        .day-cell.today .day-number { background-color: var(--color-calendario); color: white; border-radius: 50%; }
        .day-cell.other-month { opacity: 0.4; background-color: #f8fafc; }
        
        .event { background: #1e293b; color: white; padding: 6px 8px; border-radius: 8px; font-size: 0.7em; margin-top: 5px; border-left: 3px solid var(--color-calendario); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;}
        .event-count { background: #f1f5f9; color: #475569; padding: 4px; border-radius: 12px; font-size: 0.7em; margin-top: 5px; text-align: center; font-weight: 800; pointer-events: none; }
        
        /* Modal Info Evento */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); transition: opacity 0.3s;}
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 40px; border-radius: 30px; max-width: 600px; width: 90%; position: relative; max-height: 90vh; overflow-y: auto;}
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .modal-title { color: #1a1a1a; font-size: 1.5em; font-weight: 900; text-transform: uppercase;}
        .close-btn { background: none; border: none; font-size: 32px; cursor: pointer; color: #94a3b8; transition: 0.3s; }
        .close-btn:hover { color: #ef4444; transform: scale(1.1); }
        
        .event-detail-box { border-left: 6px solid var(--color-calendario); background: #f8fafc; border-radius: 20px; padding: 25px; margin-bottom: 15px; border-right: 2px solid #e2e8f0; border-top: 2px solid #e2e8f0; border-bottom: 2px solid #e2e8f0; }
        .event-detail-box h3 { color: var(--color-calendario); margin-top: 0; margin-bottom: 15px; font-size: 1.1em; font-weight: 900; text-transform: uppercase;}
        .event-detail-box p { margin: 8px 0; color: #475569; line-height: 1.4; font-weight: 600; font-size: 0.85rem;}

        @media (max-width: 1200px) { .main-content { margin-left: 240px; width: calc(100% - 240px);} .admin-layout { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .main-content { margin-left: 70px; width: calc(100% - 70px); padding: 20px;} .calendar { padding: 10px;} .day-cell { min-height: 80px;} }
    </style>
</head>
<body>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div style="margin-bottom: 20px; width: 100%; max-width: 1400px;">
            <a href="/menu_admin" class="text-slate-400 font-bold uppercase text-xs hover:text-white transition inline-flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Volver a Menú Admin
            </a>
        </div>

        <div th:if="${error}" class="max-w-[1400px] mx-auto bg-red-500 text-white p-4 rounded-xl mb-6 font-black uppercase text-xs tracking-widest shadow-lg shadow-red-500/20" th:text="${error}"></div>
        <div th:if="${success}" class="max-w-[1400px] mx-auto bg-emerald-500 text-white p-4 rounded-xl mb-6 font-black uppercase text-xs tracking-widest shadow-lg shadow-emerald-500/20" th:text="${success}"></div>

        <div class="admin-layout">
            <div class="form-card">
                <h2 id="formTitulo"><i class="fas fa-plus-circle mr-2"></i>Nueva Actividad</h2>
                
                <form th:action="@{/menu_admin/calendario/guardar}" th:object="${nuevoEvento}" method="post">
                    <input type="hidden" th:field="*{id}" id="eventoId" name="id">

                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" th:field="*{title}" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" th:field="*{date}" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>Hora</label>
                        <input type="time" th:field="*{time}" id="time" required>
                    </div>
                    <div class="form-group">
                        <label>Pista</label>
                        <select th:field="*{pista.id}" id="pista" required>
                            <option value="">Seleccionar pista...</option>
                            <option th:each="p : ${pistas}" th:value="${p.id}" th:text="${p.nombrePista}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea th:field="*{description}" id="description" rows="3"></textarea>
                    </div>
                    
                    <button type="submit" class="btn-save" id="btnSubmitForm">Publicar Reserva</button>
                    <button type="button" onclick="cancelarEdicion()" id="btnCancelEdit" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold uppercase text-xs py-3 rounded-xl transition mt-3 hidden">Cancelar Edición</button>
                </form>
            </div>

            <div class="calendar-container">
                <div class="calendar-header">
                    <div class="month-year" id="monthYear"></div>
                    <div class="nav-buttons">
                        <button class="nav-btn" onclick="previousMonth()"><i class="fas fa-chevron-left"></i></button>
                        <button class="nav-btn" onclick="nextMonth()"><i class="fas fa-chevron-right"></i></button>
                        <button class="today-btn" onclick="goToToday()">Hoy</button>
                    </div>
                </div>
                <div class="calendar" id="calendarGrid"></div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalDateTitle">Reservas del Día</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="eventDetails"></div>
        </div>
    </div>

    <div class="modal" id="deleteModal" style="z-index: 10000;">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-100 transition-transform">
            <div class="text-center">
                <div class="w-20 h-20 mx-auto bg-red-100 rounded-full flex items-center justify-center mb-6">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-500"></i>
                </div>
                <h3 class="text-2xl font-black uppercase text-slate-800 mb-3">¿Estás seguro?</h3>
                <p class="text-slate-500 font-medium mb-8 text-sm">Esta reserva será eliminada permanentemente del sistema.</p>
                <div class="flex gap-4 justify-center">
                    <button onclick="cerrarDeleteModal()" class="w-full py-3 rounded-xl font-bold uppercase text-slate-500 bg-slate-100 hover:bg-slate-200 text-xs transition">Cancelar</button>
                    <a id="btnConfirmDelete" href="#" class="w-full py-3 rounded-xl font-bold uppercase text-white bg-red-500 hover:bg-red-600 shadow-lg text-xs flex items-center justify-center transition">Eliminar</a>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let eventsData = /*[[${eventosJson}]]*/ '[]';
        let events = [];
        try { events = typeof eventsData === 'string' ? JSON.parse(eventsData) : eventsData; if (!Array.isArray(events)) { events = []; } } catch (e) { events = []; }
        
        const today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        function parseEventDate(dateArray) { if (Array.isArray(dateArray)) { return new Date(dateArray[0], dateArray[1] - 1, dateArray[2]); } return new Date(dateArray); }
        function getEventsForDate(date) { return events.filter(event => { const eventDate = parseEventDate(event.date); return eventDate.getDate() === date.getDate() && eventDate.getMonth() === date.getMonth() && eventDate.getFullYear() === date.getFullYear(); }); }

        function generateCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const prevLastDay = new Date(currentYear, currentMonth, 0);
            const firstDayIndex = (firstDay.getDay() + 6) % 7; 
            const lastDayDate = lastDay.getDate();
            const prevLastDayDate = prevLastDay.getDate();
            const calendarGrid = document.getElementById('calendarGrid');
            
            let html = `<div class="day-header">Lun</div><div class="day-header">Mar</div><div class="day-header">Mié</div><div class="day-header">Jue</div><div class="day-header">Vie</div><div class="day-header">Sáb</div><div class="day-header">Dom</div>`;
            
            for (let i = firstDayIndex - 1; i >= 0; i--) { const day = prevLastDayDate - i; const date = new Date(currentYear, currentMonth - 1, day); const isToday = date.toDateString() === today.toDateString(); html += createDayCell(day, date, true, isToday); }
            for (let day = 1; day <= lastDayDate; day++) { const date = new Date(currentYear, currentMonth, day); const isToday = date.toDateString() === today.toDateString(); html += createDayCell(day, date, false, isToday); }
            const remainingCells = 42 - (firstDayIndex + lastDayDate);
            for (let day = 1; day <= remainingCells; day++) { const date = new Date(currentYear, currentMonth + 1, day); const isToday = date.toDateString() === today.toDateString(); html += createDayCell(day, date, true, isToday); }
            
            calendarGrid.innerHTML = html;
        }

        function createDayCell(day, date, otherMonth, isToday) {
            const dayEvents = getEventsForDate(date);
            let cssClass = 'day-cell';
            if (otherMonth) cssClass += ' other-month';
            if (isToday) cssClass += ' today';
            
            const dateStr = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
            
            let eventsHtml = '';
            const maxVisible = 2;
            dayEvents.slice(0, maxVisible).forEach(event => { eventsHtml += `<div class="event">${event.title}</div>`; });
            if (dayEvents.length > maxVisible) { eventsHtml += `<div class="event-count">+${dayEvents.length - maxVisible} reservas más</div>`; }
            
            if(dayEvents.length > 0) {
                return `<div class="${cssClass}" onclick="openDayModal('${dateStr}')"><div class="day-number">${day}</div>${eventsHtml}</div>`;
            } else {
                return `<div class="${cssClass}"><div class="day-number">${day}</div></div>`;
            }
        }

        function updateCalendar() {
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('monthYear').textContent = `${monthNames[currentMonth]} ${currentYear}`;
            generateCalendar();
        }

        function previousMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } updateCalendar(); }
        function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } updateCalendar(); }
        function goToToday() { currentMonth = today.getMonth(); currentYear = today.getFullYear(); updateCalendar(); }

        function openDayModal(dateStr) {
            const parts = dateStr.split('-');
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const dayEvents = getEventsForDate(targetDate);
            
            document.getElementById('modalDateTitle').innerText = `Reservas: ${parts[2]}/${parts[1].padStart(2,'0')}/${parts[0]}`;
            
            let modalHtml = '';
            
            dayEvents.forEach(event => {
                let nombrePista = event.pista ? (event.pista.nombrePista || event.pista.nombre || 'ID: '+event.pista.id) : 'No asignada';
                
                modalHtml += `
                    <div class="event-detail-box">
                        <h3>${event.title}</h3>
                        <p><i class="far fa-clock"></i> <strong>Hora:</strong> ${formatTime(event.time)}</p>
                        <p><i class="fas fa-map-marker-alt"></i> <strong>Lugar:</strong> ${nombrePista}</p>
                        <p><i class="fas fa-align-left"></i> <strong>Detalle:</strong> ${event.description || 'N/A'}</p>
                        
                        <div class="flex gap-2 mt-4">
                            <button onclick="cargarParaEditar(${event.id})" class="bg-blue-100 text-blue-700 font-bold uppercase text-[10px] px-4 py-2 rounded-lg hover:bg-blue-200 transition">
                                <i class="fas fa-edit mr-1"></i> Editar
                            </button>
                            <button onclick="abrirDeleteModal(${event.id})" class="bg-red-100 text-red-700 font-bold uppercase text-[10px] px-4 py-2 rounded-lg hover:bg-red-200 transition">
                                <i class="fas fa-trash mr-1"></i> Eliminar
                            </button>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('eventDetails').innerHTML = modalHtml;
            document.getElementById('eventModal').classList.add('active');
        }

        // ✅ LÓGICA DEL NUEVO MODAL DE ELIMINAR
        function abrirDeleteModal(id) {
            document.getElementById('btnConfirmDelete').href = '/menu_admin/calendario/eliminar/' + id;
            document.getElementById('deleteModal').classList.add('active');
            closeModal(); // Cierra el modal de la lista de eventos para no tener 2 abiertos
        }
        function cerrarDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }

        function cargarParaEditar(eventId) {
            const event = events.find(e => e.id == eventId);
            if (event) {
                document.getElementById('eventoId').value = event.id;
                document.getElementById('title').value = event.title;
                document.getElementById('date').value = formatToInputDate(event.date);
                document.getElementById('time').value = formatToInputTime(event.time);
                if(event.pista) document.getElementById('pista').value = event.pista.id;
                document.getElementById('description').value = event.description || '';
                
                document.getElementById('formTitulo').innerHTML = '<i class="fas fa-pen mr-2 text-emerald-500"></i>Editando Reserva';
                document.getElementById('btnSubmitForm').innerText = 'Guardar Cambios';
                document.getElementById('btnSubmitForm').classList.replace('bg-emerald-500', 'bg-blue-600');
                document.getElementById('btnCancelEdit').classList.remove('hidden');
                
                closeModal();
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            }
        }

        function cancelarEdicion() {
            document.getElementById('eventoId').value = '';
            document.getElementById('title').value = '';
            document.getElementById('date').value = '';
            document.getElementById('time').value = '';
            document.getElementById('pista').value = '';
            document.getElementById('description').value = '';
            
            document.getElementById('formTitulo').innerHTML = '<i class="fas fa-plus-circle mr-2"></i>Nueva Actividad';
            document.getElementById('btnSubmitForm').innerText = 'Publicar Reserva';
            document.getElementById('btnSubmitForm').classList.replace('bg-blue-600', 'bg-emerald-500');
            document.getElementById('btnCancelEdit').classList.add('hidden');
        }

        function formatToInputDate(d) { if (Array.isArray(d)) return `${d[0]}-${d[1].toString().padStart(2, '0')}-${d[2].toString().padStart(2, '0')}`; return d.substring(0, 10); }
        function formatToInputTime(t) { if (Array.isArray(t)) return `${t[0].toString().padStart(2, '0')}:${t[1].toString().padStart(2, '0')}`; return t ? t.substring(0, 5) : ''; }
        function formatTime(timeArray) { if (Array.isArray(timeArray)) return `${timeArray[0].toString().padStart(2, '0')}:${timeArray[1].toString().padStart(2, '0')}`; return timeArray || 'N/A'; }

        function closeModal() { document.getElementById('eventModal').classList.remove('active'); }
        document.getElementById('eventModal').addEventListener('click', function(e) { if (e.target === this) { closeModal(); } });
        document.getElementById('deleteModal').addEventListener('click', function(e) { if (e.target === this) { cerrarDeleteModal(); } });
        
        updateCalendar();
    </script>
</body>
</html>
