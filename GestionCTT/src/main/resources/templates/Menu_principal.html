<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menú Principal</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background: linear-gradient(135deg, #007fff, #00c2ff); 
                font-family: 'Inter', sans-serif; 
            }
            .btn {
                transition: transform 0.3s ease-in-out;
            }
            .btn:hover {
                transform: scale(1.05);
            }
        </style>
    </head>
    <body class="flex items-center justify-center min-h-screen py-10">

        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[90%] max-w-lg text-center">

            <div class="mb-8 flex justify-center">
                <img th:src="@{/images/escudo.png}" alt="Escudo" class="w-28 h-28 object-contain">
            </div>

            <h1 class="text-4xl font-extrabold text-blue-700 mb-10 tracking-tight">Menú Principal</h1>

            <div class="grid grid-cols-2 gap-6">
                <a href="/calendario" class="btn block py-3 px-5 bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold rounded-xl text-lg shadow hover:shadow-lg">
                    Calendario
                </a>
                <a href="/jugadores" class="btn block py-3 px-5 bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold rounded-xl text-lg shadow hover:shadow-lg">
                    Jugadores
                </a>
                <a href="/trabajadores" class="btn block py-3 px-5 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold rounded-xl text-lg shadow hover:shadow-lg">
                    Trabajadores
                </a>
                <a href="/equipos" class="btn block py-3 px-5 bg-gradient-to-r from-pink-500 to-red-500 text-white font-bold rounded-xl text-lg shadow hover:shadow-lg">
                    Equipos
                </a>
                
                <a href="/menu_admin" 
                   sec:authorize="hasAuthority('ROLE_ADMIN')"
                   class="btn block py-3 px-5 bg-gradient-to-r from-teal-500 to-cyan-600 text-white font-bold rounded-xl text-lg shadow hover:shadow-lg">
                    Menú Admin
                </a>
            </div>

            <div class="mt-6">
                <a href="/logout" class="btn block py-3 px-5 bg-gradient-to-r from-red-500 to-orange-500 text-white font-bold rounded-xl text-lg shadow hover:shadow-lg">
                    Cerrar Sesión (Logout)
                </a>
            </div>

            <div class="mt-10 text-sm text-gray-500">
                <p>© 2025 Tennis ERP.</p>
            </div>

        </div>
    </body>
</html>
