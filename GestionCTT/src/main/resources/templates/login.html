<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Tennis ERP</title>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #007fff, #00c2ff);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .main-wrapper {
        display: flex;
        background-color: #ffffff;
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        animation: fadeIn 0.8s ease-in-out;
        max-width: 1000px;
        width: 100%;
      }

      .image-side {
        display: none;
      }

      @media (min-width: 768px) {
        .image-side {
          display: block;
          flex: 1;
          /* Asegúrate de que no haya espacios extras en la URL */
          background-image: url("/images/foto1.jpg");
          background-size: cover;
          background-position: center;
        }
      }

      .login-container {
        padding: 50px 40px;
        width: 100%;
        max-width: 600px;
        text-align: center;
        box-sizing: border-box;
      }

      .logo {
        width: 140px;
        margin-bottom: 30px;
      }

      h2 {
        color: #007bff;
        font-size: 30px;
        margin-bottom: 25px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .input-group {
        position: relative;
      }

      .input-group input {
        width: 100%;
        padding: 15px 40px 15px 15px;
        border: 1px solid #ccc;
        border-radius: 12px;
        font-size: 16px;
        transition: border-color 0.3s, box-shadow 0.3s;
        box-sizing: border-box;
      }

      .input-group input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
      }

      .toggle-password {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
      }

      .toggle-password svg {
        width: 24px;
        height: 24px;
        fill: #007bff;
      }

      input[type="submit"] {
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s, transform 0.2s;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
      }

      input[type="submit"]:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
      }

      .signup-link {
        font-size: 14px;
        margin-top: 25px;
      }

      .signup-link a {
        color: #007bff;
        text-decoration: none;
        transition: color 0.3s;
      }

      .signup-link a:hover {
        color: #0056b3;
        text-decoration: underline;
      }

      .message {
        font-size: 14px;
        margin-top: 10px;
      }

      .message.error {
        color: #e63946;
      }

      .message.success {
        color: #2a9d8f;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="main-wrapper">
      <div class="image-side"></div>
      <div class="login-container">
        <img th:src="@{/images/escudo.png}" alt="Logo" class="logo" />
        <h2>Iniciar Sesión</h2>
        <form th:action="@{/login}" method="post">
          <!-- Usuario -->
          <div class="input-group">
            <input
              type="text"
              name="username"
              placeholder="Nombre de usuario"
              required
            />
          </div>

          <!-- Contraseña con mostrar/ocultar -->
          <div class="input-group">
            <input
              type="password"
              name="password"
              placeholder="Contraseña"
              required
              id="passwordField"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword()"
            >
              <!-- OJO -->
              <svg
                id="eyeOpen"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"
                />
                <circle cx="12" cy="12" r="2" />
              </svg>
              <!-- OJO TACHADO -->
              <svg
                id="eyeClosed"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                style="display: none"
              >
                <path
                  d="M1 1l22 22m-2.1-4.1A11.924 11.924 0 0 0 23 12s-4-7-11-7c-2.1 0-4 .6-5.7 1.6m-3.6 2.3C2 10 1 12 1 12s4 7 11 7c2.5 0 4.7-.8 6.5-2.1"
                />
              </svg>
            </button>
          </div>

          <!-- Botón de login -->
          <input type="submit" value="Iniciar Sesión" />

          <!-- Mensajes -->
          <div th:if="${error}" class="message error" th:text="${error}"></div>
          <div
            th:if="${message}"
            class="message success"
            th:text="${message}"
          ></div>
        </form>

        <div class="signup-link">
          ¿No tienes una cuenta? <a href="/signup">Regístrate aquí</a>
        </div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("passwordField");
        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeOpen.style.display = "none";
          eyeClosed.style.display = "inline";
        } else {
          passwordInput.type = "password";
          eyeOpen.style.display = "inline";
          eyeClosed.style.display = "none";
        }
      }
    </script>
  </body>
</html>
