<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Ligas</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen flex items-center justify-center font-sans">

        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[95%] max-w-5xl text-center">

            <h1 class="text-4xl font-bold text-blue-700 mb-8">Gestión de Ligas</h1>

            <!-- Botón nueva liga -->
            <div class="mb-6 text-right">
                <a href="/menuAdmin/ligas/nueva"
                   class="btn inline-block py-2 px-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-semibold rounded-lg hover:from-green-600 hover:to-emerald-600 shadow">
                    + Nueva Liga
                </a>
            </div>

            <!-- Tabla de ligas -->
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm border rounded-lg">
                    <thead class="bg-blue-100">
                        <tr>
                            <th class="py-3 px-6">ID</th>
                            <th class="py-3 px-6">Nombre</th>
                            <th class="py-3 px-6">Categorías</th>
                            <th class="py-3 px-6">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="liga : ${ligas}" class="border-b hover:bg-gray-100 transition">
                            <td class="py-3 px-6" th:text="${liga.id}"></td>
                            <td class="py-3 px-6" th:text="${liga.nombre}"></td>
                            <td class="py-3 px-6">
                                <a th:href="@{'/menuAdmin/ligas/categorias/' + ${liga.id}}"
                                   class="text-blue-600 hover:underline">Ver categorías</a>
                            </td>
                            <td class="py-3 px-6 space-x-2">
                                <a th:href="@{'/menuAdmin/ligas/editar/' + ${liga.id}}"
                                   class="py-1 px-3 bg-yellow-400 text-white rounded hover:bg-yellow-500">Editar</a>
                                <a th:href="@{'/menuAdmin/ligas/eliminar/' + ${liga.id}}"
                                   onclick="return confirm('¿Estás seguro de eliminar esta liga?')"
                                   class="py-1 px-3 bg-red-500 text-white rounded hover:bg-red-600">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Botón Atrás -->
            <div class="mt-8">
                <a href="/menuAdmin"
                   class="btn block py-2 px-4 bg-gray-500 text-white font-bold rounded-lg text-sm hover:bg-gray-600 inline-block">
                    Volver al Menú Admin
                </a>
            </div>

        </div>
    </body>
</html>
