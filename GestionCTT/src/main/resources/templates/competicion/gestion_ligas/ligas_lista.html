<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ligas - CTT Steel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========================================================
           1. RESET Y ANTI-SALTO
           ======================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; background-attachment: fixed; min-height: 100vh; overflow-y: scroll; }
        
        /* ========================================================
           2. VARIABLES Y TEMAS
           ======================================================== */
        .theme-admin { --bg-page: radial-gradient(circle at center, #2d3748 0%, #0f172a 100%); --accent: #94a3b8; }
        .theme-player { --bg-page: linear-gradient(180deg, #0c2b1d 0%, #1a4731 100%); --accent: #10b981; }
        body { background: var(--bg-page); }

        /* ========================================================
           3. SIDEBAR IDÉNTICA Y PERFECTA
           ======================================================== */
        :root { --color-perfil: #8b5cf6; --color-jugadores: #3b82f6; --color-usuarios: #8b5cf6; --color-roles: #f59e0b; --color-ligas: #06b6d4; --color-equipos: #f43f5e; --color-calendario: #10b981; --ctt-gris-borde: #475569; --ctt-plata: #94a3b8; --ctt-pizarra: #334155; }
        
        .sidebar { width: 280px; background: rgba(0, 0, 0, 0.85); border-right: 3px solid var(--ctt-gris-borde); padding: 30px 0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; backdrop-filter: blur(10px); display: flex; flex-direction: column; box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5); }
        .sidebar-content { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .user-profile-section { padding: 0 25px 25px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; flex-shrink: 0; }
        .user-profile-link { display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; text-decoration: none; transition: 0.3s; border: 1px solid transparent; position: relative; overflow: hidden; }
        .user-profile-link:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--color-perfil); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(139, 92, 246, 0.2); }
        .user-profile-link:hover::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--color-perfil); }
        
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-avatar-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, var(--color-perfil), #6d28d9); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.2rem; }
        
        .user-info { flex: 1; min-width: 0; }
        .user-name { color: white; font-weight: 700; font-size: 1rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { color: var(--ctt-plata); font-size: 0.8rem; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .user-role-badge { background: rgba(139, 92, 246, 0.2); color: var(--color-perfil); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
        .profile-arrow { color: var(--ctt-plata); transition: transform 0.3s ease; }
        .user-profile-link:hover .profile-arrow { color: var(--color-perfil); transform: translateX(3px); }
        
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; padding: 0 20px; flex: 1; }
        .sidebar-link { display: flex; align-items: center; gap: 15px; padding: 16px 20px; color: var(--ctt-plata); text-decoration: none; border-radius: 12px; transition: 0.3s; font-weight: 600; font-size: 0.95rem; position: relative; overflow: hidden; flex-shrink: 0; }
        .sidebar-link::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 0; background: rgba(255, 255, 255, 0.05); transition: width 0.3s ease; }
        .sidebar-link:hover::before { width: 100%; }
        .sidebar-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 1; }
        .sidebar-link:hover { color: white; transform: translateX(5px); }
        .sidebar-link:hover .sidebar-icon { transform: scale(1.1); }
        .sidebar-divider { height: 1px; background: rgba(255, 255, 255, 0.1); margin: 15px 20px; flex-shrink: 0; }

        .sidebar-jugadores:hover { color: var(--color-jugadores); } .sidebar-usuarios:hover { color: var(--color-usuarios); } .sidebar-roles:hover { color: var(--color-roles); } .sidebar-ligas:hover { color: var(--color-ligas); } .sidebar-equipos:hover { color: var(--color-equipos); } .sidebar-calendario:hover { color: var(--color-calendario); }

        /* ========================================================
           4. LAYOUT CONDICIONAL Y RESPONSIVE
           ======================================================== */
        body.admin-layout .main-content { margin-left: 280px; width: calc(100% - 280px); }
        body.player-layout .main-content { margin-left: 0; width: 100%; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }

        @media (max-width: 1200px) { 
            .sidebar { width: 240px; } 
            body.admin-layout .main-content { margin-left: 240px; width: calc(100% - 240px); } 
        }
        @media (max-width: 768px) { 
            .sidebar { width: 70px; padding: 20px 0;} 
            .user-profile-section, .sidebar-link span, .sidebar-divider { display: none; } 
            .user-profile-link { justify-content: center; padding: 15px 10px; margin: 0 10px 15px 10px; } 
            .user-avatar { width: 40px; height: 40px; } 
            .sidebar-menu { padding: 0 15px; align-items: center;} 
            .sidebar-link { padding: 15px; justify-content: center;} 
            body.admin-layout .main-content { margin-left: 70px; width: calc(100% - 70px); } 
            .liga-header{ flex-direction: column; gap: 20px;}
        }

        /* ========================================================
           5. CSS ESPECÍFICO DE LA PÁGINA
           ======================================================== */
        .list-container { max-width: 1100px; width: 95%; margin: 50px auto; background: rgba(255, 255, 255, 0.98); border-radius: 40px; padding: 50px; border: 6px solid #475569; box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5); }
        .liga-header { background: #1a1a1a; color: white; padding: 25px 40px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--accent); }
        .btn-danger-tech { background: #450a0a; color: #fecaca; border: 1px solid #991b1b; padding: 10px 15px; border-radius: 10px; font-size: 10px; font-weight: 900; text-transform: uppercase; transition: 0.3s; }
        .btn-danger-tech:hover { background: #991b1b; color: white; transform: scale(1.05); }

        /* ✅ GÉNEROS COLORES */
        .gen-MASCULINO { background-color: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .gen-FEMENINO { background-color: #fdf2f8; color: #e11d48; border: 1px solid #fbcfe8; }
        .gen-MIXTO { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    </style>
</head>
<body th:class="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'theme-admin admin-layout' : 'theme-player player-layout'">
    
    <div th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}" th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">
        <header class="py-10 text-center w-full relative">
            <a href="/menu_admin" class="absolute left-10 top-14 text-white font-900 uppercase text-xs hover:text-slate-400 transition"><i class="fas fa-arrow-left"></i> Menú Admin</a>
            <h1 class="inline-block bg-black text-white px-12 py-4 rounded-full border-4 border-slate-400 text-3xl font-900 uppercase tracking-widest shadow-2xl">
                Ligas & Divisiones
            </h1>
        </header>

        <main class="list-container shadow-2xl">
            <div class="flex justify-end mb-10 px-4">
                <a href="/ligas/nueva" class="bg-black text-white px-6 py-3 rounded-xl font-900 text-[10px] uppercase border-2 border-slate-400 hover:bg-slate-800 transition shadow-lg">
                    <i class="fas fa-plus mr-2"></i> Crear Competición
                </a>
            </div>

            <div th:each="liga : ${ligas}" th:if="${liga != null}" class="mb-14">
                <div class="liga-header shadow-xl">
                    <div class="max-w-[65%] w-full">
                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-[4px]">Categoría Master</span>
                        <h2 class="text-2xl font-900 uppercase tracking-tighter" th:text="${liga.nombre}">LIGA</h2>
                        <p class="text-sm text-white font-medium mt-3 leading-relaxed" th:text="${liga.descripcion ?: 'Sin descripción técnica registrada.'}"></p>
                    </div>
                    <div class="flex items-center gap-3 w-full md:w-auto mt-4 md:mt-0 justify-end">
                        <a th:href="@{'/ligas/editar/' + ${liga.id}}" class="text-[10px] font-900 bg-slate-700 px-5 py-3 rounded-lg hover:bg-slate-600 border border-slate-500 transition"><i class="fas fa-cog mr-1"></i> Ajustes</a>
                        <a href="javascript:void(0)" th:attr="onclick=|openDeleteModal('/ligas/eliminar/${liga.id}')|" class="btn-danger-tech"><i class="fas fa-trash-alt"></i></a>
                    </div>
                </div>

                <div class="flex justify-end mb-4 px-2 mt-4">
                    <a th:href="@{'/categorias/nueva/' + ${liga.id}}" class="text-[10px] font-black text-emerald-600 uppercase tracking-widest hover:underline border border-emerald-200 bg-emerald-50 px-3 py-1 rounded-lg"><i class="fas fa-plus"></i> Nueva División</a>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div th:each="categoria : ${liga.categorias}" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex flex-col hover:border-slate-300 transition shadow-sm group">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-900 text-sm uppercase text-black" th:text="${categoria.nombre}">CATEGORIA</h3>
                                <span class="text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded-md mt-1 inline-block"
                                      th:classappend="'gen-' + ${categoria.genero}"
                                      th:text="${categoria.genero}">GENERO</span>
                            </div>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <a th:href="@{'/categorias/editar/' + ${categoria.id}}" class="text-slate-400 hover:text-black transition p-1"><i class="fas fa-edit"></i></a>
                                <a href="javascript:void(0)" th:attr="onclick=|openDeleteModal('/categorias/eliminar/${categoria.id}')|" class="text-red-400 hover:text-red-600 transition p-1"><i class="fas fa-trash-alt"></i></a>
                            </div>
                        </div>
                        <p class="text-xs font-medium text-slate-600 mt-auto pt-3 border-t border-slate-200" th:text="${categoria.descripcion ?: 'Sin detalles técnicos.'}"></p>
                    </div>
                    <div th:if="${#lists.isEmpty(liga.categorias)}" class="col-span-full text-center py-4 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200">
                        <span class="text-[9px] font-bold text-slate-400 uppercase">No hay divisiones configuradas</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="deleteModal" class="fixed inset-0 z-[500] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform" id="deleteModalContent">
            <div class="text-center">
                <div class="w-20 h-20 mx-auto bg-red-100 rounded-full flex items-center justify-center mb-6"><i class="fas fa-exclamation-triangle text-4xl text-red-500"></i></div>
                <h3 class="text-2xl font-black uppercase text-slate-800 mb-3">¿Estás seguro?</h3>
                <p class="text-slate-500 font-medium mb-8 text-sm">Esta acción es irreversible.</p>
                <div class="flex gap-4 justify-center">
                    <button onclick="closeDeleteModal()" class="w-full py-3 rounded-xl font-bold uppercase text-slate-500 bg-slate-100 hover:bg-slate-200 text-xs">Cancelar</button>
                    <a id="confirmDeleteBtn" href="#" class="w-full py-3 rounded-xl font-bold uppercase text-white bg-red-500 hover:bg-red-600 shadow-lg text-xs flex items-center justify-center">Eliminar</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        function openDeleteModal(url) { document.getElementById('confirmDeleteBtn').href = url; const modal = document.getElementById('deleteModal'); modal.classList.remove('hidden'); setTimeout(() => document.getElementById('deleteModalContent').classList.replace('scale-95', 'scale-100'), 10); }
        function closeDeleteModal() { document.getElementById('deleteModalContent').classList.replace('scale-100', 'scale-95'); setTimeout(() => document.getElementById('deleteModal').classList.add('hidden'), 300); }
    </script>
</body>
</html>
