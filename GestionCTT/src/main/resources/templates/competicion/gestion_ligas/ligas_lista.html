<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ligas CTT - Steel Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        .theme-admin { --bg-page: radial-gradient(circle at center, #2d3748 0%, #0f172a 100%); --accent: #94a3b8; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg-page); min-height: 100vh; color: black; }
        .list-container { max-width: 1100px; margin: 50px auto; background: rgba(255, 255, 255, 0.98); border-radius: 40px; padding: 50px; border: 6px solid #475569; box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5); }
        .liga-header { background: #1a1a1a; color: white; padding: 25px 40px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--accent); }
        .btn-danger-tech { background: #450a0a; color: #fecaca; border: 1px solid #991b1b; padding: 8px 15px; border-radius: 10px; font-size: 10px; font-weight: 900; text-transform: uppercase; transition: 0.3s; }
        .btn-danger-tech:hover { background: #991b1b; color: white; transform: scale(1.05); }

        /* --- LINK TÉCNICO ESTÁTICO (IGUAL AL DE USUARIOS) --- */
        .nav-link-tech {
            font-weight: 900; text-transform: uppercase; font-size: 0.75rem;
            letter-spacing: 3px; color: var(--accent);
            display: inline-flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
    </style>
</head>
<body class="theme-admin">
    <header class="py-10 text-center">
        <h1 class="inline-block bg-black text-white px-12 py-4 rounded-full border-4 border-slate-400 text-3xl font-900 uppercase tracking-widest shadow-2xl">
            Ligas & Divisiones
        </h1>
    </header>

    <main class="list-container shadow-2xl">
        <div class="flex justify-between items-center mb-10 px-4">
            <a href="/menu_admin" class="nav-link-tech">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <b>Consola</b>
            </a>
            
            <a href="/ligas/nueva" class="bg-black text-white px-6 py-3 rounded-xl font-900 text-[10px] uppercase border-2 border-slate-400 hover:bg-slate-800 transition shadow-lg">
                + Crear Competición
            </a>
        </div>

        <div th:each="liga : ${ligas}" th:if="${liga != null}" class="mb-14">
            <div class="liga-header shadow-xl">
                <div class="max-w-[65%]">
                    <span class="text-[9px] font-black text-slate-500 uppercase tracking-[4px]">Categoría Master</span>
                    <h2 class="text-2xl font-900 uppercase tracking-tighter" th:text="${liga.nombre}">LIGA</h2>
                    
                    <p class="text-sm text-white font-medium mt-3 leading-relaxed" 
                       th:text="${liga.descripcion ?: 'Sin descripción técnica registrada.'}"></p>
                </div>
                <div class="flex items-center gap-3">
                    <a th:href="@{'/ligas/editar/' + ${liga.id}}" class="text-[10px] font-900 bg-slate-700 px-5 py-2 rounded-lg hover:bg-slate-600 border border-slate-500 transition">EDITAR</a>
                    <a th:href="@{'/ligas/eliminar/' + ${liga.id}}" 
                       onclick="return confirm('¿ESTÁS SEGURO?')"
                       class="btn-danger-tech">ELIMINAR</a>
                </div>
            </div>

            <div class="flex justify-end mb-4 px-2 mt-4">
                <a th:href="@{'/categorias/nueva/' + ${liga.id}}" class="text-[10px] font-black text-emerald-600 uppercase tracking-widest hover:underline">+ Nueva División</a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="categoria : ${liga.categorias}" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex flex-col hover:border-slate-300 transition shadow-sm group">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-900 text-sm uppercase text-black" th:text="${categoria.nombre}">CATEGORIA</h3>
                            <span class="text-[8px] font-black bg-slate-100 px-2 py-1 rounded text-slate-500 uppercase" th:text="${categoria.genero}">GENERO</span>
                        </div>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <a th:href="@{'/categorias/editar/' + ${categoria.id}}" class="text-slate-400 hover:text-black transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                            </a>
                            <a th:href="@{'/categorias/eliminar/' + ${categoria.id}}" onclick="return confirm('¿Borrar división?')" class="text-red-400 hover:text-red-600 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </a>
                        </div>
                    </div>
                    
                    <p class="text-xs font-medium text-slate-600 mt-auto pt-3 border-t border-slate-200" 
                       th:text="${categoria.descripcion ?: 'Sin detalles técnicos.'}"></p>
                </div>
                
                <div th:if="${#lists.isEmpty(liga.categorias)}" class="col-span-full text-center py-4 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200">
                    <span class="text-[9px] font-bold text-slate-400 uppercase">No hay divisiones configuradas</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
