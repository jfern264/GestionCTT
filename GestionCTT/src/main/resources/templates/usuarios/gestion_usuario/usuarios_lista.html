<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - CTT Steel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root { --bg-grad-1: #1f2937; --bg-grad-2: #0f172a; --card-bg: #1e293b; --card-bg-hover: #0f172a; --border-color: #334155; --border-highlight: #475569; --text-main: #f1f5f9; --text-muted: #94a3b8; --btn-bg: #334155; --btn-hover: #475569; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; background: radial-gradient(circle at center, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%); background-attachment: fixed; color: var(--text-main); min-height: 100vh; overflow-y: scroll; transition: background 0.5s ease; }
        
        .theme-card { background: var(--card-bg); border-color: var(--border-color); transition: all 0.3s ease; }
        .theme-row { background: var(--card-bg-hover); border-color: transparent; transition: all 0.3s ease; }
        .theme-text { color: var(--text-main); }
        .theme-muted { color: var(--text-muted); }
        .theme-border { border-color: var(--border-color); }
        .theme-input { background: var(--card-bg-hover); border-color: var(--border-color); color: var(--text-main); }
        .theme-input:focus { border-color: var(--border-highlight); }
        .theme-btn { background: var(--btn-bg); color: var(--text-main); }
        .theme-btn:hover { background: var(--border-highlight); border-color: var(--border-highlight); }

        /* CLASES PURAS PARA EL DROPDOWN (Evita bugs de renderizado de Chromium) */
        .custom-select-wrapper { position: relative; min-width: 220px; user-select: none; }
        .custom-select-btn { width: 100%; padding: 12px 16px; border-radius: 1rem; font-weight: bold; border: 2px solid var(--border-color); background: var(--card-bg-hover); color: var(--text-main); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; outline: none; }
        .custom-select-btn:hover { border-color: var(--border-highlight); }
        .custom-select-menu { position: absolute; top: calc(100% + 8px); left: 0; width: 100%; background: var(--card-bg); border: 2px solid var(--border-highlight); border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; display: none; flex-direction: column; overflow: hidden; }
        .custom-select-menu.active { display: flex; }
        .custom-select-option { padding: 12px 16px; cursor: pointer; font-weight: bold; color: var(--text-main); border-bottom: 1px solid var(--border-color); transition: background 0.2s; }
        .custom-select-option:last-child { border-bottom: none; }
        .custom-select-option:hover { background-color: var(--border-highlight); }

        body.admin-layout .main-content { margin-left: 280px; width: calc(100% - 280px); }
        body.player-layout .main-content { margin-left: 0; width: 100%; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }

        .list-container { max-width: 1250px; width: 95%; margin-top: 30px; border-radius: 40px; padding: 40px; border: 4px solid; box-shadow: 0 20px 50px rgba(0,0,0,0.4);}
        .user-grid-layout { display: grid; grid-template-columns: 80px 1.5fr 1fr 1fr 100px; align-items: center; gap: 15px; }
        .user-row { padding: 12px 25px; border-radius: 20px; margin-bottom: 10px; border: 3px solid transparent; }

        .row-hidden { display: none !important; }

        .user-row[data-genero="MASCULINO"]:hover { border-color: #38bdf8; border-width: 4px; transform: scale(1.02); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.15); background: var(--card-bg); }
        .user-row[data-genero="FEMENINO"]:hover { border-color: #f472b6; border-width: 4px; transform: scale(1.02); box-shadow: 0 10px 20px rgba(244, 114, 182, 0.15); background: var(--card-bg); }
        .user-row[data-genero="MIXTO"]:hover { border-color: #4ade80; border-width: 4px; transform: scale(1.02); box-shadow: 0 10px 20px rgba(74, 222, 128, 0.15); background: var(--card-bg); }
        .user-row:hover:not([data-genero]) { border-color: var(--border-highlight); border-width: 4px; transform: scale(1.02); background: var(--card-bg); }

        .gen-MASCULINO { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .gen-FEMENINO { background-color: rgba(225, 29, 72, 0.2); color: #f472b6; border: 1px solid #ec4899; }
        .gen-MIXTO { background-color: rgba(22, 163, 74, 0.2); color: #4ade80; border: 1px solid #22c55e; }

        .pagination-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; padding-top: 20px; border-top: 2px solid var(--border-color); }
        .page-btn { padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; border: none; outline: none; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .theme-switcher-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg); border: 3px solid var(--border-highlight); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 999; transition: 0.3s; }
        .theme-switcher-btn:hover { transform: rotate(45deg) scale(1.1); }
        .theme-panel { position: fixed; bottom: 100px; right: 30px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 20px; padding: 20px; width: 250px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 998; display: none; opacity: 0; transition: 0.3s; }
        .theme-panel.active { display: block; opacity: 1; }
        .theme-option { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; font-weight: bold; text-align: left; display: flex; align-items: center; gap: 10px; transition: 0.2s; color: white; }
        .theme-option:hover { transform: translateX(5px); border-color: rgba(255,255,255,0.3); }

        @media (max-width: 768px) { body.admin-layout .main-content { margin-left: 70px; width: calc(100% - 70px); } .user-grid-layout{ display: block !important; } .user-row{ margin-bottom: 15px;} }
    </style>
</head>
<body class="theme-admin" th:classappend="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'admin-layout' : 'player-layout'">
    
    <div th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}" th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">
        <header class="py-10 text-center w-full relative">
            <h1 class="theme-card px-16 py-4 rounded-full font-black text-3xl uppercase inline-block border-4 shadow-xl tracking-wider theme-text">Usuarios</h1>
            
            <div class="mt-6 flex flex-col md:flex-row justify-center gap-4 px-4 max-w-[800px] mx-auto">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-4 top-4 theme-muted"></i>
                    <input type="text" id="search" placeholder="Buscar por nombre, email o DNI..." class="w-full pl-12 pr-4 py-3 rounded-2xl font-bold border-2 outline-none shadow-md theme-input">
                </div>

                <div class="custom-select-wrapper shadow-md">
                    <div id="filterGenderBtn" class="custom-select-btn">
                        <span id="filterGenderText">Todos los Géneros</span>
                        <i class="fas fa-chevron-down theme-muted transition-transform duration-300" id="filterGenderIcon"></i>
                    </div>
                    
                    <div id="filterGenderMenu" class="custom-select-menu">
                        <div class="custom-select-option" data-val="">Todos los Géneros</div>
                        <div class="custom-select-option" data-val="MASCULINO">Masculino</div>
                        <div class="custom-select-option" data-val="FEMENINO">Femenino</div>
                        <div class="custom-select-option" data-val="MIXTO">Mixto</div>
                    </div>
                    <input type="hidden" id="filterGender" value="">
                </div>

                <a th:href="@{/usuarios/nuevo}" class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-2xl font-bold shadow-md flex items-center justify-center gap-2 transition-colors">
                    <i class="fas fa-plus"></i> Nuevo
                </a>
            </div>
        </header>

        <main class="list-container theme-card" id="tableContainer">
            <div class="hidden md:grid user-grid-layout px-8 mb-4 text-[9px] font-black uppercase tracking-[3px] theme-muted mt-2">
                <span>Perfil</span><span>Identidad</span><span>Email</span><span>Roles</span><span class="text-right">Gestión</span>
            </div>

            <div id="lista" class="space-y-2 min-h-[450px]">
                <div th:each="usuario, stat : ${usuarios}" 
                     class="user-row theme-row user-grid-layout" 
                     th:data-genero="${usuario.genero}"
                     th:style="${stat.index >= 6 ? 'display: none;' : ''}">
                    <div class="relative w-16 h-16 cursor-pointer group" onclick="openImagePreview(this.querySelector('img').src)">
                        <img th:src="${usuario.avatar != null && !usuario.avatar.isEmpty()} ? @{/images/{path}(path=${usuario.avatar})} : 'https://ui-avatars.com/api/?name=' + ${usuario.nombre} + '&background=random&color=fff'"
                             class="w-full h-full object-cover rounded-2xl shadow-sm group-hover:scale-105 transition-transform theme-border border-2">
                    </div>

                    <div class="flex flex-col mt-3 md:mt-0">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-sm uppercase theme-text" th:text="${usuario.nombre + ' ' + usuario.primerApellido}"></span>
                            <i th:if="${usuario.capitan}" class="fas fa-star text-amber-500 text-xs" title="Capitán"></i>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[9px] font-bold theme-muted uppercase" th:text="${usuario.dni}"></span>
                            <span th:if="${usuario.genero != null}" class="text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-md"
                                  th:classappend="'gen-' + ${usuario.genero}" th:text="${usuario.genero}"></span>
                        </div>
                    </div>
                    
                    <span class="text-xs font-bold theme-muted my-2 md:my-0" th:text="${usuario.email}"></span>
                    
                    <div class="mb-3 md:mb-0 flex flex-wrap gap-1">
                        <span th:each="rol : ${usuario.roles}" class="theme-card theme-text border px-2 py-1 rounded text-[8px] font-black uppercase" th:text="${rol.nombreRol.replace('ROLE_', '')}"></span>
                    </div>
                    
                    <div class="flex justify-end gap-2">
                        <a th:href="@{'/usuarios/editar/' + ${usuario.id}}" class="w-9 h-9 flex items-center justify-center rounded-xl theme-btn" title="Editar"><i class="fas fa-edit"></i></a>
                        <a href="javascript:void(0)" th:attr="onclick=|openDeleteModal('/usuarios/eliminar/${usuario.id}')|" class="w-9 h-9 flex items-center justify-center rounded-xl bg-red-900/30 text-red-400 hover:bg-red-600 hover:text-white transition-colors" title="Eliminar"><i class="fas fa-trash-alt"></i></a>
                    </div>
                </div>
            </div>

            <div class="pagination-controls" id="paginationBox">
                <button id="prevBtn" class="page-btn theme-btn" onclick="changePage(-1)" disabled><i class="fas fa-chevron-left mr-2"></i> Anterior</button>
                <span id="pageInfo" class="font-black uppercase tracking-widest text-xs theme-muted">Cargando...</span>
                <button id="nextBtn" class="page-btn theme-btn" onclick="changePage(1)" disabled>Siguiente <i class="fas fa-chevron-right ml-2"></i></button>
            </div>
        </main>
    </div>

    <div id="imagePreviewModal" class="fixed inset-0 z-[300] hidden flex items-center justify-center bg-black/90 backdrop-blur-sm" onclick="closeImagePreview()">
        <img id="modalPreviewImg" class="max-w-[90%] max-h-[90%] rounded-2xl shadow-2xl object-cover transform scale-95 transition-transform border-4 theme-border">
    </div>

    <div id="deleteModal" class="fixed inset-0 z-[500] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="theme-card transform scale-95 transition-transform" id="deleteModalContent" style="max-width: 400px; padding: 40px; border-radius: 30px;">
            <div class="text-center">
                <div class="w-20 h-20 mx-auto bg-red-900/30 rounded-full flex items-center justify-center mb-6"><i class="fas fa-exclamation-triangle text-4xl text-red-500"></i></div>
                <h3 class="text-2xl font-black uppercase theme-text mb-3">¿Estás seguro?</h3>
                <p class="theme-muted font-medium mb-8 text-sm">El usuario será eliminado permanentemente.</p>
                <div class="flex gap-4 justify-center">
                    <button onclick="closeDeleteModal()" class="w-full py-3 rounded-xl font-bold uppercase theme-muted theme-btn text-xs">Cancelar</button>
                    <a id="confirmDeleteBtn" href="#" class="w-full py-3 rounded-xl font-bold uppercase text-white bg-red-600 hover:bg-red-700 shadow-lg text-xs flex items-center justify-center">Eliminar</a>
                </div>
            </div>
        </div>
    </div>

    <button class="theme-switcher-btn" onclick="toggleThemePanel()"><i class="fas fa-palette"></i></button>
    <div class="theme-panel" id="themePanel">
        <h4 class="text-sm font-black uppercase text-center mb-4 theme-text border-b pb-2 theme-border">Elige tu estilo</h4>
        <div id="themeOptions"></div>
    </div>

    <script>
        const themePanelOptions = document.getElementById('themeOptions');
        for (const [key, data] of Object.entries(globalThemes)) {
            const btn = document.createElement('div');
            btn.className = 'theme-option';
            btn.style.backgroundColor = data.colors.border || data.colors.highlight;
            btn.innerHTML = `<span class="w-4 h-4 rounded-full bg-white opacity-50"></span> ${data.name}`;
            btn.onclick = () => { applyThemeGlobal(key); localStorage.setItem('ctt_admin_theme', key); toggleThemePanel(); };
            themePanelOptions.appendChild(btn);
        }
        function toggleThemePanel() { document.getElementById('themePanel').classList.toggle('active'); }

        // ==========================================
        // LÓGICA CUSTOM DROPDOWN PURA
        // ==========================================
        const filterBtn = document.getElementById('filterGenderBtn');
        const filterMenu = document.getElementById('filterGenderMenu');
        const filterText = document.getElementById('filterGenderText');
        const filterInput = document.getElementById('filterGender');
        const filterIcon = document.getElementById('filterGenderIcon');

        filterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            filterMenu.classList.toggle('active');
            filterIcon.style.transform = filterMenu.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0deg)';
            filterBtn.style.borderColor = filterMenu.classList.contains('active') ? 'var(--border-highlight)' : 'var(--border-color)';
        });

        document.querySelectorAll('.custom-select-option').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                filterInput.value = item.getAttribute('data-val');
                filterText.innerText = item.innerText;
                
                // Cerrar Menú
                filterMenu.classList.remove('active');
                filterIcon.style.transform = 'rotate(0deg)';
                filterBtn.style.borderColor = 'var(--border-color)';
                
                // Dispara el filtro
                currentPage = 1; 
                updateList();
            });
        });

        document.addEventListener('click', () => {
            if (filterMenu.classList.contains('active')) {
                filterMenu.classList.remove('active');
                filterIcon.style.transform = 'rotate(0deg)';
                filterBtn.style.borderColor = 'var(--border-color)';
            }
        });

        // ==========================================
        // LÓGICA ORIGINAL DE TABLA
        // ==========================================
        const itemsPerPage = 6;
        let currentPage = 1;
        let allItems = Array.from(document.querySelectorAll('.user-row'));
        let filteredItems = [...allItems];

        function updateList() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const genderFilter = document.getElementById('filterGender').value;

            filteredItems = allItems.filter(row => {
                const textData = row.innerText.toLowerCase();
                const matchesSearch = textData.includes(searchTerm);
                const rowGender = row.getAttribute('data-genero') || '';
                const matchesGender = genderFilter === "" || rowGender === genderFilter;
                return matchesSearch && matchesGender;
            });

            const totalPages = Math.ceil(filteredItems.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages || 1;
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            allItems.forEach(row => row.style.display = 'none');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            filteredItems.slice(start, end).forEach(row => row.style.display = '');

            document.getElementById('pageInfo').innerText = `Página ${currentPage} de ${totalPages} (${filteredItems.length} regs)`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages || totalPages === 0;
        }

        function changePage(direction) {
            currentPage += direction;
            updateList();
        }

        document.getElementById('search').addEventListener('input', () => { currentPage = 1; updateList(); });

        updateList();

        function openImagePreview(src) { document.getElementById('modalPreviewImg').src = src; document.getElementById('imagePreviewModal').classList.remove('hidden'); setTimeout(() => document.getElementById('modalPreviewImg').classList.replace('scale-95', 'scale-100'), 10); }
        function closeImagePreview() { document.getElementById('modalPreviewImg').classList.replace('scale-100', 'scale-95'); setTimeout(() => document.getElementById('imagePreviewModal').classList.add('hidden'), 300); }
        function openDeleteModal(url) { document.getElementById('confirmDeleteBtn').href = url; const modal = document.getElementById('deleteModal'); modal.classList.remove('hidden'); setTimeout(() => document.getElementById('deleteModalContent').classList.replace('scale-95', 'scale-100'), 10); }
        function closeDeleteModal() { document.getElementById('deleteModalContent').classList.replace('scale-100', 'scale-95'); setTimeout(() => document.getElementById('deleteModal').classList.add('hidden'), 300); }
    </script>
</body>
</html>
