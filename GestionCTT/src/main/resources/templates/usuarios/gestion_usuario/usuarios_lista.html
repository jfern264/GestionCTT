<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Usuarios - CTT Steel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .theme-admin { --bg-page: radial-gradient(circle at center, #2d3748 0%, #0f172a 100%); --accent: #94a3b8; --pill-border: #94a3b8; }
        :root { --ctt-carbono: #1a1a1a; --ctt-gris-borde: #475569; --ctt-acero-luz: #e2e8f0; }

        body { font-family: 'Montserrat', sans-serif; background: var(--bg-page); background-attachment: fixed; min-height: 100vh; margin: 0; }
        .header-section { padding: 50px 20px 40px 20px; text-align: center; }
        .main-pill-title { background: #000000; color: white; padding: 15px 80px; border-radius: 100px; font-weight: 900; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); display: inline-block; border: 4px solid var(--pill-border); }
        .list-container { max-width: 1250px; margin: 0 auto 80px auto; background: rgba(255, 255, 255, 0.98); border-radius: 40px; padding: 50px; border: 6px solid var(--ctt-gris-borde); box-shadow: 0 50px 100px rgba(0,0,0,0.5); }
        
        .user-grid-layout { display: grid; grid-template-columns: 60px 1.5fr 1fr 1fr 120px; align-items: center; gap: 15px; }
        .user-row { padding: 15px 25px; border-radius: 20px; margin-bottom: 10px; border: 2px solid #f1f5f9; background: white; transition: 0.3s; }
        .user-row:hover { transform: scale(1.01); border-color: var(--accent); background: #f8fafc; }

        .role-tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 9px; font-weight: 900; text-transform: uppercase; background: #1a1a1a; color: #f1f5f9; margin-right: 4px; }
        .action-btn { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #f1f5f9; border: 1px solid var(--ctt-acero-luz); color: #475569; transition: 0.2s; }
        .action-btn:hover { background: #000; color: #fff; }
        
        /* BOTÓN DE VOLVER ESTÁTICO */
        .nav-link-tech {
            font-weight: 900; text-transform: uppercase; font-size: 0.75rem;
            letter-spacing: 3px; color: var(--accent);
            display: inline-flex; align-items: center; gap: 10px;
            text-decoration: none;
        }

        .action-btn-danger { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #fff1f2; border: 1px solid #ffe4e6; color: #e11d48; transition: 0.2s; }
        .action-btn-danger:hover { background: #e11d48; color: #fff; }
        .search-bar { width: 100%; max-width: 500px; background: white; border-radius: 20px; padding: 14px 25px 14px 55px; font-weight: 700; border: 2px solid var(--accent); outline: none; }
    </style>
</head>
<body class="theme-admin pb-20">

    <header class="header-section">
        <h1 class="main-pill-title">Usuarios</h1>
        <div class="mt-8 flex justify-center relative">
            <input type="text" id="userSearch" placeholder="Filtrar por nombre, email o rol..." class="search-bar">
        </div>
    </header>

    <main class="list-container">
        <div class="flex justify-between items-center mb-10 px-4">
            <a href="/menu_admin" class="nav-link-tech">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <b>Menú Administrativo</b>
            </a>
            
            <a href="/usuarios/nuevo" class="py-3 px-6 bg-black text-white rounded-xl font-900 text-[11px] uppercase border-2 border-slate-400 hover:bg-slate-800 transition-all">
                + Registrar Usuario
            </a>
        </div>

        <div class="hidden md:grid user-grid-layout px-8 mb-4 text-[9px] font-black uppercase tracking-[3px] text-slate-400">
            <span>ID</span><span>Identidad</span><span>Email</span><span>Roles</span><span class="text-right">Gestión</span>
        </div>

        <div id="userList" class="space-y-2">
            <div th:each="usuario : ${usuarios}" class="user-row user-grid-layout">
                <span class="font-black text-slate-300" th:text="${usuario.id}">01</span>
                <div class="flex flex-col">
                    <span class="font-900 text-sm uppercase text-black" th:text="${usuario.nombre + ' ' + usuario.primerApellido + ' ' + usuario.segundoApellido}">Nombre</span>
                    <span class="text-[9px] font-bold text-slate-400 tracking-widest uppercase" th:text="${usuario.nombreUsuario}">@user</span>
                </div>
                <span class="text-xs font-bold text-slate-500" th:text="${usuario.email}">email@ctt.com</span>
                <div>
                    <span th:each="rol : ${usuario.roles}" class="role-tag" th:text="${rol.nombreRol.replace('ROLE_', '')}">ADMIN</span>
                </div>
                
                <div class="flex justify-end gap-2">
                    <a th:href="@{'/usuarios/editar/' + ${usuario.id}}" class="action-btn" title="Editar">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                    </a>
                    <a th:href="@{'/usuarios/eliminar/' + ${usuario.id}}" 
                       class="action-btn-danger" 
                       title="Eliminar permanentemente"
                       onclick="return confirm('¿CONFIRMAR ELIMINACIÓN? Esta acción es irreversible y el usuario perderá acceso al sistema.')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('userSearch').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.user-row').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(term) ? 'grid' : 'none';
            });
        });
    </script>
</body>
</html>
