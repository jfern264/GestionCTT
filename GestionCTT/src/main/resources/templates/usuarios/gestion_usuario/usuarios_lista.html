<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - CTT Steel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; background-attachment: fixed; min-height: 100vh; overflow-y: scroll; }
        .theme-admin { --bg-page: radial-gradient(circle at center, #2d3748 0%, #0f172a 100%); --accent: #94a3b8; }
        .theme-player { --bg-page: linear-gradient(180deg, #0c2b1d 0%, #1a4731 100%); --accent: #10b981; }
        body { background: var(--bg-page); }

        :root { --color-perfil: #8b5cf6; --color-jugadores: #3b82f6; --color-usuarios: #8b5cf6; --color-roles: #f59e0b; --color-ligas: #06b6d4; --color-equipos: #f43f5e; --color-calendario: #10b981; --ctt-gris-borde: #475569; --ctt-plata: #94a3b8; --ctt-pizarra: #334155; }
        .sidebar { width: 280px; background: rgba(0, 0, 0, 0.85); border-right: 3px solid var(--ctt-gris-borde); padding: 30px 0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; backdrop-filter: blur(10px); display: flex; flex-direction: column; box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5); }
        .sidebar-content { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .user-profile-section { padding: 0 25px 25px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; flex-shrink: 0; }
        .user-profile-link { display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; text-decoration: none; transition: 0.3s; border: 1px solid transparent; position: relative; overflow: hidden; }
        .user-profile-link:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--color-perfil); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(139, 92, 246, 0.2); }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { color: white; font-weight: 700; font-size: 1rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { color: var(--ctt-plata); font-size: 0.8rem; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .user-role-badge { background: rgba(139, 92, 246, 0.2); color: var(--color-perfil); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; padding: 0 20px; flex: 1; }
        .sidebar-link { display: flex; align-items: center; gap: 15px; padding: 16px 20px; color: var(--ctt-plata); text-decoration: none; border-radius: 12px; transition: 0.3s; font-weight: 600; font-size: 0.95rem; position: relative; overflow: hidden; flex-shrink: 0; }
        .sidebar-link::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 0; background: rgba(255, 255, 255, 0.05); transition: width 0.3s ease; }
        .sidebar-link:hover::before { width: 100%; }
        .sidebar-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 1; }
        .sidebar-link:hover { color: white; transform: translateX(5px); }
        .sidebar-link:hover .sidebar-icon { transform: scale(1.1); }
        .sidebar-divider { height: 1px; background: rgba(255, 255, 255, 0.1); margin: 15px 20px; flex-shrink: 0; }
        .sidebar-jugadores:hover { color: var(--color-jugadores); } .sidebar-usuarios:hover { color: var(--color-usuarios); } .sidebar-roles:hover { color: var(--color-roles); } .sidebar-ligas:hover { color: var(--color-ligas); } .sidebar-equipos:hover { color: var(--color-equipos); } .sidebar-calendario:hover { color: var(--color-calendario); }

        body.admin-layout .main-content { margin-left: 280px; width: calc(100% - 280px); }
        body.player-layout .main-content { margin-left: 0; width: 100%; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }

        @media (max-width: 1200px) { .sidebar { width: 240px; } body.admin-layout .main-content { margin-left: 240px; width: calc(100% - 240px); } }
        @media (max-width: 768px) { .sidebar { width: 70px; padding: 20px 0;} .user-profile-section, .sidebar-link span, .sidebar-divider { display: none; } .user-profile-link { justify-content: center; padding: 15px 10px; margin: 0 10px 15px 10px; } .user-avatar { width: 40px; height: 40px; } .sidebar-menu { padding: 0 15px; align-items: center;} .sidebar-link { padding: 15px; justify-content: center;} body.admin-layout .main-content { margin-left: 70px; width: calc(100% - 70px); } .user-grid-layout{ display: block !important; } .user-row{ margin-bottom: 15px;} }

        .list-container { max-width: 1250px; width: 95%; margin-top: 30px; background: rgba(255, 255, 255, 0.98); border-radius: 40px; padding: 40px; border: 6px solid #475569; box-shadow: 0 50px 100px rgba(0,0,0,0.5);}
        .user-grid-layout { display: grid; grid-template-columns: 80px 1.5fr 1fr 1fr 100px; align-items: center; gap: 15px; }
        .user-row { padding: 12px 25px; border-radius: 20px; margin-bottom: 10px; border: 2px solid #f1f5f9; background: white; transition: 0.3s; }
        .user-row:hover { transform: scale(1.01); border-color: var(--accent); }
        .action-btn { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #f1f5f9; color: #475569; transition: 0.3s;}

        /* ✅ GÉNEROS COLORES */
        .gen-MASCULINO { background-color: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .gen-FEMENINO { background-color: #fdf2f8; color: #e11d48; border: 1px solid #fbcfe8; }
        .gen-MIXTO { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    </style>
</head>
<body class="theme-admin" th:classappend="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'admin-layout' : 'player-layout'">
    
    <div th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}" th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">
        <header class="py-10 text-center w-full relative">
            <a href="/menu_admin" class="absolute left-10 top-14 text-white font-900 uppercase text-xs hover:text-slate-400 transition"><i class="fas fa-arrow-left"></i> Menú Admin</a>
            <h1 class="bg-black text-white px-16 py-4 rounded-full font-black text-3xl uppercase inline-block border-4 border-slate-400 shadow-xl">Usuarios</h1>
            <div class="mt-6 flex justify-center px-4">
                <input type="text" id="search" placeholder="Filtrar por nombre o email..." class="w-full max-w-[500px] p-4 rounded-2xl font-bold border-2 border-slate-400 outline-none shadow-md focus:border-black">
            </div>
        </header>

        <main class="list-container">
            <div class="flex justify-end mb-6">
                <a href="/usuarios/nuevo" class="bg-black text-white px-6 py-3 rounded-xl font-black uppercase text-[11px] hover:bg-slate-800 transition shadow-md"><i class="fas fa-plus mr-1"></i> Nuevo Usuario</a>
            </div>

            <div class="hidden md:grid user-grid-layout px-8 mb-4 text-[9px] font-black uppercase tracking-[3px] text-slate-400">
                <span>Perfil</span><span>Identidad</span><span>Email</span><span>Roles</span><span class="text-right">Gestión</span>
            </div>

            <div id="lista" class="space-y-2">
                <div th:each="usuario : ${usuarios}" class="user-row user-grid-layout">
                    <div class="relative w-16 h-16 cursor-pointer group" onclick="openImagePreview(this.querySelector('img').src)">
                        <input type="hidden" th:value="${usuario.id}">
                        <img th:src="${usuario.avatar != null && !usuario.avatar.isEmpty()} ? @{/images/{path}(path=${usuario.avatar})} : 'https://ui-avatars.com/api/?name=' + ${usuario.nombre} + '&background=1a1a1a&color=fff'"
                             class="w-full h-full object-cover rounded-2xl shadow-sm group-hover:scale-105 transition-transform border border-slate-200">
                    </div>

                    <div class="flex flex-col mt-3 md:mt-0">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-sm uppercase text-black" th:text="${usuario.nombre + ' ' + usuario.primerApellido}"></span>
                            <i th:if="${usuario.capitan}" class="fas fa-star text-amber-500 text-xs" title="Capitán"></i>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[9px] font-bold text-slate-400 uppercase" th:text="${usuario.dni}"></span>
                            <span th:if="${usuario.genero != null}" class="text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-md"
                                  th:classappend="'gen-' + ${usuario.genero}" th:text="${usuario.genero}"></span>
                        </div>
                    </div>
                    
                    <span class="text-xs font-bold text-slate-500 my-2 md:my-0" th:text="${usuario.email}"></span>
                    
                    <div class="mb-3 md:mb-0 flex flex-wrap gap-1">
                        <span th:each="rol : ${usuario.roles}" class="bg-slate-800 text-white px-2 py-1 rounded text-[8px] font-black uppercase" th:text="${rol.nombreRol.replace('ROLE_', '')}"></span>
                    </div>
                    
                    <div class="flex justify-end gap-2">
                        <a th:href="@{'/usuarios/editar/' + ${usuario.id}}" class="action-btn hover:bg-black hover:text-white" title="Editar"><i class="fas fa-edit"></i></a>
                        <a href="javascript:void(0)" th:attr="onclick=|openDeleteModal('/usuarios/eliminar/${usuario.id}')|" class="action-btn bg-red-50 text-red-500 hover:bg-red-600 hover:text-white" title="Eliminar"><i class="fas fa-trash-alt"></i></a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="imagePreviewModal" class="fixed inset-0 z-[300] hidden flex items-center justify-center bg-black/90 backdrop-blur-sm" onclick="closeImagePreview()"><img id="modalPreviewImg" class="max-w-[90%] max-h-[90%] rounded-2xl shadow-2xl object-cover transform scale-95 transition-transform border-4 border-white"></div>
    <div id="deleteModal" class="fixed inset-0 z-[500] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity"><div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform" id="deleteModalContent"><div class="text-center"><div class="w-20 h-20 mx-auto bg-red-100 rounded-full flex items-center justify-center mb-6"><i class="fas fa-exclamation-triangle text-4xl text-red-500"></i></div><h3 class="text-2xl font-black uppercase text-slate-800 mb-3">¿Estás seguro?</h3><p class="text-slate-500 font-medium mb-8 text-sm">El usuario será borrado permanentemente.</p><div class="flex gap-4 justify-center"><button onclick="closeDeleteModal()" class="w-full py-3 rounded-xl font-bold uppercase text-slate-500 bg-slate-100 hover:bg-slate-200 text-xs">Cancelar</button><a id="confirmDeleteBtn" href="#" class="w-full py-3 rounded-xl font-bold uppercase text-white bg-red-500 hover:bg-red-600 shadow-lg text-xs flex items-center justify-center">Eliminar</a></div></div></div></div>

    <script>
        document.getElementById('search').addEventListener('input', e => { const term = e.target.value.toLowerCase(); document.querySelectorAll('.user-row').forEach(row => row.style.display = row.innerText.toLowerCase().includes(term) ? '' : 'none'); });
        function openImagePreview(src) { document.getElementById('modalPreviewImg').src = src; document.getElementById('imagePreviewModal').classList.remove('hidden'); setTimeout(() => document.getElementById('modalPreviewImg').classList.replace('scale-95', 'scale-100'), 10); }
        function closeImagePreview() { document.getElementById('modalPreviewImg').classList.replace('scale-100', 'scale-95'); setTimeout(() => document.getElementById('imagePreviewModal').classList.add('hidden'), 300); }
        function openDeleteModal(url) { document.getElementById('confirmDeleteBtn').href = url; const modal = document.getElementById('deleteModal'); modal.classList.remove('hidden'); setTimeout(() => document.getElementById('deleteModalContent').classList.replace('scale-95', 'scale-100'), 10); }
        function closeDeleteModal() { document.getElementById('deleteModalContent').classList.replace('scale-100', 'scale-95'); setTimeout(() => document.getElementById('deleteModal').classList.add('hidden'), 300); }
    </script>
</body>
</html>
