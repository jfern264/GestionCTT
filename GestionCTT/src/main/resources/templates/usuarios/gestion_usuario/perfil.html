<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - CTT</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .theme-player { --bg-body: #f3f4f6; --bg-header: linear-gradient(135deg, #1a4731 0%, #2d5a27 100%); --btn-color: #cc5233; --btn-hover: #a33f27; }
        .theme-admin { --bg-body: #0f172a; --bg-header: #1a1a1a; --btn-color: #94a3b8; --btn-hover: #475569; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-body); margin: 0; min-height: 100vh;}
        .header-gradient { background: var(--bg-header); }
        .profile-card { margin-top: -80px; background: white; border-radius: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        .input-field { border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; width: 100%; font-weight: 600; color: #1a1a1a; transition: 0.3s; }
        .input-field:focus { border-color: var(--btn-color); outline: none; }
        .btn-submit { background: var(--btn-color); color: white; transition: 0.3s; }
        .btn-submit:hover { background: var(--btn-hover); }
    </style>
</head>
<body th:class="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'theme-admin' : 'theme-player'">

    <a th:href="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? '/menu_admin' : '/menu_principal'" 
       class="absolute top-6 left-6 flex items-center gap-2 text-white font-900 uppercase text-[10px] tracking-[3px] hover:text-gray-300 transition z-50">
        <i class="fas fa-arrow-left"></i> Volver a mi menú
    </a>

    <div class="header-gradient h-64 w-full flex justify-center pt-10">
        <h1 class="text-white text-3xl font-black uppercase tracking-widest mt-4">Hola, <span th:text="${usuario.nombre}"></span></h1>
    </div>

    <div class="max-w-4xl mx-auto px-4 pb-20 w-full">
        <div th:if="${mensaje}" class="relative -top-10 mb-6 p-4 bg-emerald-500 text-white rounded-2xl shadow-lg text-center font-bold uppercase text-xs z-10" th:text="${mensaje}"></div>
        
        <form th:action="@{/perfil/guardar}" method="POST" enctype="multipart/form-data">
            <div class="profile-card p-8 md:p-12 relative">
                <div class="flex flex-col md:flex-row gap-10 items-center md:items-start">
                    
                    <div class="flex flex-col items-center min-w-[220px]">
                        <div class="relative group cursor-pointer" onclick="openImagePreview(this.querySelector('img').src)">
                            <img id="preview" th:src="${usuario.avatar != null && !usuario.avatar.isEmpty()} ? @{/images/{path}(path=${usuario.avatar})} : 'https://ui-avatars.com/api/?name=' + ${usuario.nombre} + '&background=1a1a1a&color=fff'"
                                 class="w-48 h-48 rounded-full border-4 border-white shadow-xl object-cover">
                        </div>
                        
                        <div class="mt-6 space-y-3 w-full">
                            <label class="block text-center bg-gray-100 hover:bg-gray-200 text-gray-700 text-[10px] font-black uppercase py-3 rounded-xl cursor-pointer transition">
                                <i class="fas fa-upload mr-2"></i> Cambiar Foto
                                <input type="file" name="archivoImagen" id="file-input" class="hidden" accept="image/*">
                            </label>
                            <a th:if="${usuario.avatar != null && !usuario.avatar.isEmpty()}" 
                               href="javascript:void(0)" onclick="openDeleteModal('/perfil/eliminar-avatar')"
                               class="block text-center bg-red-50 hover:bg-red-500 hover:text-white text-red-600 border border-red-200 text-[10px] font-black uppercase py-3 rounded-xl transition">
                                <i class="fas fa-trash-alt mr-2"></i> Eliminar Foto
                            </a>
                        </div>
                    </div>

                    <div class="flex-1 w-full space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
                            <div><label class="text-[10px] font-bold uppercase text-gray-400">Nombre</label><input type="text" name="nombre" th:value="${usuario.nombre}" class="input-field"></div>
                            <div><label class="text-[10px] font-bold uppercase text-gray-400">Primer Apellido</label><input type="text" name="primerApellido" th:value="${usuario.primerApellido}" class="input-field"></div>
                            <div><label class="text-[10px] font-bold uppercase text-gray-400">Email</label><input type="email" name="email" th:value="${usuario.email}" class="input-field"></div>
                            <div><label class="text-[10px] font-bold uppercase text-gray-400">Teléfono</label><input type="text" name="telefono" th:value="${usuario.telefono}" class="input-field"></div>
                            <div class="md:col-span-2"><label class="text-[10px] font-bold uppercase text-gray-400">Nueva Contraseña</label><input type="password" name="password" class="input-field" placeholder="Dejar en blanco para no cambiar"></div>
                        </div>

                        <div class="pt-8 flex justify-end">
                            <button type="submit" class="btn-submit px-10 py-4 rounded-xl font-black uppercase text-xs tracking-widest shadow-lg">Guardar Cambios</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div id="imagePreviewModal" class="fixed inset-0 z-[300] hidden flex items-center justify-center bg-black/90 backdrop-blur-sm" onclick="closeImagePreview()">
        <img id="modalPreviewImg" class="max-w-[90%] max-h-[90%] rounded-2xl border-4 border-white shadow-2xl object-cover transform scale-95 transition-transform duration-300">
    </div>

    <div id="deleteModal" class="fixed inset-0 z-[500] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl">
            <div class="text-center">
                <div class="w-20 h-20 mx-auto bg-red-100 rounded-full flex items-center justify-center mb-6"><i class="fas fa-exclamation-triangle text-4xl text-red-500"></i></div>
                <h3 class="text-2xl font-black uppercase text-slate-800 mb-3">¿Borrar foto?</h3>
                <div class="flex gap-4 justify-center mt-6">
                    <button onclick="closeDeleteModal()" class="w-full py-3 rounded-xl font-bold uppercase text-slate-500 bg-slate-100 text-xs">Cancelar</button>
                    <a id="confirmDeleteBtn" href="#" class="w-full py-3 rounded-xl font-bold uppercase text-white bg-red-500 shadow-lg text-xs flex items-center justify-center">Sí, Eliminar</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('file-input').onchange = function (evt) {
            const [file] = this.files;
            if (file) { document.getElementById('preview').src = URL.createObjectURL(file); }
        }
        function openImagePreview(src) { document.getElementById('modalPreviewImg').src = src; document.getElementById('imagePreviewModal').classList.remove('hidden'); setTimeout(() => document.getElementById('modalPreviewImg').classList.replace('scale-95', 'scale-100'), 10); }
        function closeImagePreview() { document.getElementById('modalPreviewImg').classList.replace('scale-100', 'scale-95'); setTimeout(() => document.getElementById('imagePreviewModal').classList.add('hidden'), 300); }
        function openDeleteModal(url) { document.getElementById('confirmDeleteBtn').href = url; document.getElementById('deleteModal').classList.remove('hidden'); }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.add('hidden'); }
    </script>
</body>
</html>
