<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Club Tennis Terrassa</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --ctt-verde: #1a4731; --ctt-arcilla: #cc5233; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f3f4f6; min-height: 100vh; }
        .header-gradient { background: linear-gradient(135deg, var(--ctt-verde) 0%, #2d5a27 100%); }
        .profile-card { margin-top: -100px; background: white; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .input-field { border: 2px solid #edf2f0; border-radius: 12px; padding: 12px 16px; transition: all 0.3s; width: 100%; font-size: 0.9rem; }
        .input-field:focus { border-color: var(--ctt-verde); outline: none; background-color: #f9fdfb; }
        .btn-save { background-color: var(--ctt-arcilla); color: white; padding: 14px 28px; border-radius: 15px; font-weight: 700; transition: all 0.3s; cursor: pointer; border: none; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(204, 82, 51, 0.3); }
    </style>
</head>
<body>

    <div class="header-gradient h-64 w-full flex justify-center pt-10">
        <h1 class="text-white text-3xl font-900 uppercase tracking-tighter">
            Hola, <span th:text="${usuario.nombre}">Socio</span>
        </h1>
    </div>

    <div class="max-w-5xl mx-auto px-4 pb-20">
        <div th:if="${mensaje}" class="mb-6 p-4 bg-green-500 text-white rounded-2xl shadow-lg text-center font-bold uppercase tracking-widest text-xs">
            <span th:text="${mensaje}">¡Actualizado!</span>
        </div>

        <div class="profile-card p-8 md:p-12">
            <div class="flex flex-col md:flex-row gap-10 items-center md:items-start">
                
                <div class="flex flex-col items-center min-w-[220px]">
                    <div class="relative">
                        <img th:src="${'https://ui-avatars.com/api/?name=' + usuario.nombre + '+' + usuario.primerApellido + '&background=1a4731&color=fff&size=150'}" 
                             alt="Avatar" class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-white shadow-lg">
                    </div>
                    <div class="mt-6 space-y-2 text-center">
                        <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">
                            DNI: <span class="text-gray-700" th:text="${usuario.dni}">-</span>
                        </p>
                        <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">
                            Edad: <span class="text-gray-700" th:text="${usuario.edad}">0</span> años
                        </p>
                    </div>
                </div>

                <div class="flex-1 w-full">
                    <form th:action="@{/perfil/guardar}" method="POST" class="space-y-6">
                        <input type="hidden" name="id" th:value="${usuario.id}">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
                            <div>
                                <label class="text-[10px] font-900 uppercase text-gray-400 tracking-widest ml-1">Nombre</label>
                                <input type="text" name="nombre" th:value="${usuario.nombre}" class="input-field">
                            </div>
                            <div>
                                <label class="text-[10px] font-900 uppercase text-gray-400 tracking-widest ml-1">Primer Apellido</label>
                                <input type="text" name="primerApellido" th:value="${usuario.primerApellido}" class="input-field">
                            </div>
                            <div>
                                <label class="text-[10px] font-900 uppercase text-gray-400 tracking-widest ml-1">Segundo Apellido</label>
                                <input type="text" name="segundoApellido" th:value="${usuario.segundoApellido}" class="input-field">
                            </div>
                            <div>
                                <label class="text-[10px] font-900 uppercase text-gray-400 tracking-widest ml-1">Email de contacto</label>
                                <input type="email" name="email" th:value="${usuario.email}" class="input-field">
                            </div>
                            <div>
                                <label class="text-[10px] font-900 uppercase text-gray-400 tracking-widest ml-1">Teléfono móvil</label>
                                <input type="text" name="telefono" th:value="${usuario.telefono}" class="input-field">
                            </div>
                            <div>
                                <label class="text-[10px] font-900 uppercase text-gray-400 tracking-widest ml-1">Nombre de Usuario</label>
                                <input type="text" th:value="${usuario.nombreUsuario}" class="input-field bg-gray-50 text-gray-400 cursor-not-allowed" readonly title="El nombre de usuario no se puede modificar">
                            </div>
                            <div class="md:col-span-2">
                                <label class="text-[10px] font-900 uppercase text-gray-400 tracking-widest ml-1">Cambiar Contraseña</label>
                                <input type="password" name="password" class="input-field" placeholder="Dejar en blanco para mantener la actual">
                            </div>
                        </div>

                        <div class="pt-8 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-6">
                            <a href="/menu_principal" class="text-[10px] font-900 text-gray-400 hover:text-gray-600 uppercase tracking-[0.2em] transition-colors">
                                ← Volver al Menú
                            </a>
                            <button type="submit" class="btn-save w-full sm:w-64">
                                Actualizar Perfil
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
