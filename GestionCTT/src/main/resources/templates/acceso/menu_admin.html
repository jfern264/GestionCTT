<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Admin - CTT Platinum</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ctt-carbono: #1a1a1a;
            --ctt-pizarra: #334155;
            --ctt-plata: #94a3b8;
            --ctt-acero-luz: #e2e8f0;
            --ctt-negro-puro: #000000;
            --ctt-gris-borde: #475569; 
            
            /* Paleta de colores para Hovers */
            --color-jugadores: #3b82f6; /* Azul */
            --color-usuarios: #8b5cf6;  /* Violeta */
            --color-roles: #f59e0b;     /* Ámbar */
            --color-ligas: #06b6d4;     /* Cian */
            --color-equipos: #f43f5e;   /* Rosa/Rojo */
            --color-calendario: #10b981; /* Esmeralda */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #2d3748 0%, #0f172a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER --- */
        .header-section {
            padding: 70px 20px 50px 20px;
            text-align: center;
        }

        .main-pill-title {
            background: var(--ctt-negro-puro);
            color: white;
            padding: 18px 90px;
            border-radius: 100px;
            font-weight: 900;
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            display: inline-block;
            border: 4px solid var(--ctt-plata);
        }

        .admin-badge {
            background: rgba(226, 232, 240, 0.1);
            color: var(--ctt-plata);
            padding: 10px 30px;
            border-radius: 5px;
            font-weight: 900;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-left: 4px solid var(--ctt-plata);
            margin-bottom: 25px;
            display: inline-block;
        }

        /* --- CONTENEDOR DE TARJETAS --- */
        .menu-container {
            max-width: 800px;
            width: 90%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 60px;
            border: 6px solid var(--ctt-gris-borde);
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            margin-bottom: 60px;
        }

        /* DISEÑO BASE DE BOTÓN (MANTIENE ANIMACIÓN CHULA) */
        .admin-link {
            display: grid;
            grid-template-columns: 60px 1fr auto;
            align-items: center;
            padding: 25px 35px;
            background: white;
            border: 1px solid var(--ctt-acero-luz);
            border-radius: 20px;
            margin-bottom: 18px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        /* El Indicador Lateral (La "animación chula") */
        .admin-link::before {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%; width: 0;
            transition: width 0.3s ease, background-color 0.3s ease;
            z-index: 0;
        }

        .admin-link:hover {
            transform: translateX(12px); /* Un poco más de desplazamiento para impacto */
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .admin-link:hover::before {
            width: 10px; /* Indicador lateral al hacer hover */
        }

        .link-text {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--ctt-pizarra);
            text-transform: uppercase;
            z-index: 1;
            transition: color 0.3s;
        }

        .link-icon {
            width: 45px; height: 45px;
            background: #f1f5f9;
            color: var(--ctt-pizarra);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            z-index: 1;
            transition: all 0.3s;
        }

        .arrow-icon { color: var(--ctt-acero-luz); transition: 0.3s; }

        /* --- LÓGICA DE COLORES POR CADA BOTÓN --- */

        /* 1. Jugadores - AZUL */
        .btn-jugadores:hover { border-color: var(--color-jugadores); }
        .btn-jugadores:hover::before { background-color: var(--color-jugadores); }
        .btn-jugadores:hover .link-text { color: var(--color-jugadores); }
        .btn-jugadores:hover .link-icon { background-color: var(--color-jugadores); color: white; transform: rotate(-10deg); }
        .btn-jugadores:hover .arrow-icon { color: var(--color-jugadores); transform: translateX(5px); }

        /* 2. Usuarios - VIOLETA */
        .btn-usuarios:hover { border-color: var(--color-usuarios); }
        .btn-usuarios:hover::before { background-color: var(--color-usuarios); }
        .btn-usuarios:hover .link-text { color: var(--color-usuarios); }
        .btn-usuarios:hover .link-icon { background-color: var(--color-usuarios); color: white; transform: rotate(-10deg); }
        .btn-usuarios:hover .arrow-icon { color: var(--color-usuarios); transform: translateX(5px); }

        /* 3. Roles - ÁMBAR */
        .btn-roles:hover { border-color: var(--color-roles); }
        .btn-roles:hover::before { background-color: var(--color-roles); }
        .btn-roles:hover .link-text { color: var(--color-roles); }
        .btn-roles:hover .link-icon { background-color: var(--color-roles); color: white; transform: rotate(-10deg); }
        .btn-roles:hover .arrow-icon { color: var(--color-roles); transform: translateX(5px); }

        /* 4. Ligas - CIAN */
        .btn-ligas:hover { border-color: var(--color-ligas); }
        .btn-ligas:hover::before { background-color: var(--color-ligas); }
        .btn-ligas:hover .link-text { color: var(--color-ligas); }
        .btn-ligas:hover .link-icon { background-color: var(--color-ligas); color: white; transform: rotate(-10deg); }
        .btn-ligas:hover .arrow-icon { color: var(--color-ligas); transform: translateX(5px); }

        /* 5. Equipos - ROSA */
        .btn-equipos:hover { border-color: var(--color-equipos); }
        .btn-equipos:hover::before { background-color: var(--color-equipos); }
        .btn-equipos:hover .link-text { color: var(--color-equipos); }
        .btn-equipos:hover .link-icon { background-color: var(--color-equipos); color: white; transform: rotate(-10deg); }
        .btn-equipos:hover .arrow-icon { color: var(--color-equipos); transform: translateX(5px); }

        .btn-calendario:hover { border-color: var(--color-calendario); }
        .btn-calendario:hover::before { background-color: var(--color-calendario); }
        .btn-calendario:hover .link-text { color: var(--color-calendario); }
        .btn-calendario:hover .link-icon { background-color: var(--color-calendario); color: white; transform: rotate(-10deg); }
        .btn-calendario:hover .arrow-icon { color: var(--color-calendario); transform: translateX(5px); }

        .btn-back {
            margin-top: 30px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--ctt-plata);
            padding: 12px 30px;
            border: 2px solid var(--ctt-acero-luz);
            border-radius: 10px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back:hover { 
            background: var(--ctt-pizarra); color: white;
            border-color: var(--ctt-pizarra);
        }

    </style>
</head>
<body class="pb-20">

    <header class="header-section flex flex-col items-center">
        <div class="admin-badge">Centro de Control Administrativo v1.2</div>
        <h1 class="main-pill-title">Administración</h1>
    </header>

    <main class="menu-container">
        
        <div class="space-y-2">
            
            <a href="/jugadores" class="admin-link btn-jugadores">
                <div class="link-icon">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                </div>
                <span class="link-text ml-4">Gestión de Jugadores</span>
                <svg class="arrow-icon w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
            </a>

            <a href="/usuarios" class="admin-link btn-usuarios">
                <div class="link-icon">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                </div>
                <span class="link-text ml-4">Control de Usuarios</span>
                <svg class="arrow-icon w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
            </a>

            <a href="/roles" class="admin-link btn-roles">
                <div class="link-icon">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                </div>
                <span class="link-text ml-4">Configurar Roles</span>
                <svg class="arrow-icon w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
            </a>

            <a href="/ligas" class="admin-link btn-ligas">
                <div class="link-icon">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                </div>
                <span class="link-text ml-4">Ligas y Categorías</span>
                <svg class="arrow-icon w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
            </a>

            <a href="/equipos" class="admin-link btn-equipos">
                <div class="link-icon">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                </div>
                <span class="link-text ml-4">Gestión de Equipos</span>
                <svg class="arrow-icon w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
            </a>

            <a href="/menu_admin/calendario" class="admin-link btn-calendario">
                <div class="link-icon">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <span class="link-text ml-4">Calendario de Eventos</span>
                <svg class="arrow-icon w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" />
                </svg>
            </a>

        </div>

        <div class="flex justify-center">
            <a href="/menu_principal" class="btn-back">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                Regresar al Sistema Principal
            </a>
        </div>
        

    </main>

    <footer class="text-center opacity-30">
        <p class="text-[9px] text-white font-black uppercase tracking-[10px]">CTT Steel Edition 2026</p>
    </footer>

</body>
</html>
