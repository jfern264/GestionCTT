<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Crear Jugador</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen flex items-center justify-center font-sans">

        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[95%] max-w-4xl">

            <h1 class="text-3xl font-bold text-blue-700 mb-6 text-center">Crear Nuevo Jugador</h1>

            <form th:action="@{/menuAdmin/jugadores/guardar}" th:object="${jugador}" method="post" class="grid grid-cols-2 gap-6">

                <div class="col-span-2">
                    <label class="block font-semibold text-gray-700">Nombre de Usuario *</label>
                    <input th:field="*{nombreUsuario}" class="w-full p-2 border rounded-md">
                    <p class="text-red-500 text-sm" th:errors="*{nombreUsuario}"></p>
                </div>

                <div class="col-span-2">
                    <label class="block font-semibold text-gray-700">Contraseña *</label>
                    <input type="password" th:field="*{password}" class="w-full p-2 border rounded-md">
                    <p class="text-red-500 text-sm" th:errors="*{password}"></p>
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Nombre</label>
                    <input th:field="*{nombre}" class="w-full p-2 border rounded-md">
                    <p class="text-red-500 text-sm" th:errors="*{nombre}"></p>
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Primer Apellido</label>
                    <input th:field="*{primerApellido}" class="w-full p-2 border rounded-md">
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Segundo Apellido</label>
                    <input th:field="*{segundoApellido}" class="w-full p-2 border rounded-md">
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">DNI *</label>
                    <input th:field="*{dni}" class="w-full p-2 border rounded-md">
                    <p class="text-red-500 text-sm" th:errors="*{dni}"></p>
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Email *</label>
                    <input th:field="*{email}" type="email" class="w-full p-2 border rounded-md">
                    <p class="text-red-500 text-sm" th:errors="*{email}"></p>
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Teléfono</label>
                    <input th:field="*{telefono}" class="w-full p-2 border rounded-md">
                    <p class="text-red-500 text-sm" th:errors="*{telefono}"></p>
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Fecha de Nacimiento</label>
                    <input type="date" th:field="*{fechaNacimiento}" class="w-full p-2 border rounded-md">
                    <p class="text-red-500 text-sm" th:errors="*{fechaNacimiento}"></p>
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Matrícula</label>
                    <input th:field="*{matricula}" class="w-full p-2 border rounded-md">
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Género *</label>
                    <select th:field="*{genero}" class="w-full p-2 border rounded-md" required>
                        <option value="" disabled th:selected="*{genero} == null">Selecciona una opción</option>
                        <option th:value="MASCULINO">Masculino</option>
                        <option th:value="FEMENINO">Femenino</option>
                        <option th:value="OTRO">Otro</option>
                    </select>
                    <p class="text-red-500 text-sm" th:errors="*{genero}"></p>
                </div>

                <div>
                    <label class="block font-semibold text-gray-700">Forma de Pago</label>
                    <select th:field="*{formaDePago}" class="w-full p-2 border rounded-md">
                        <option value="" disabled th:selected="*{formaDePago} == null">Selecciona una opción</option>
                        <option value="efectivo">Efectivo</option>
                        <option value="domiciliación">Domiciliación</option>
                        <option value="tarjeta">Tarjeta</option>
                    </select>
                </div>

                <div class="col-span-2">
                    <label class="block font-semibold text-gray-700">URL del Avatar</label>
                    <input th:field="*{avatar}" class="w-full p-2 border rounded-md">
                </div>

                <div class="col-span-2 flex justify-between mt-6">
                    <a href="/menuAdmin/jugadores" class="py-2 px-4 bg-gray-500 text-white rounded-md hover:bg-gray-600">Cancelar</a>
                    <button type="submit" class="py-2 px-6 bg-blue-600 text-white rounded-md hover:bg-blue-700">Guardar Jugador</button>
                </div>
            </form>

        </div>
    </body>
</html>
