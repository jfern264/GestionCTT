<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Equipos - Tennis ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen py-10 px-4">
    <div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-2xl p-8">
        <h1 class="text-4xl font-bold text-blue-700 mb-6 text-center">Lista de Equipos</h1>

        <div th:each="liga : ${ligas}" class="mb-12 border-b pb-6">
            <div class="bg-blue-100 p-4 rounded-lg mb-4">
                <h2 class="text-2xl font-semibold text-blue-800" th:text="${liga.nombre}">Liga</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div th:each="categoria : ${liga.categorias}" class="bg-gray-100 p-4 rounded-lg shadow">
                    <div class="flex justify-between items-center mb-2">
                        <div>
                            <h3 class="text-lg font-bold text-blue-700" th:text="${categoria.nombre}">Categoría</h3>
                        </div>
                        <a th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/editar'}"
                           sec:authorize="hasAuthority('ROLE_ADMIN')"
                           class="py-1 px-3 bg-yellow-500 text-white rounded hover:bg-yellow-600 text-sm">✏️ Editar</a>
                    </div>

                    <table class="w-full text-sm mt-2 border border-gray-300">
                        <thead class="bg-gray-200 text-gray-600">
                            <tr>
                                <th class="px-3 py-2 text-left">Jugador</th>
                                <th class="px-2 py-2 text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="uc : ${categoria.usuarioCategorias}" class="bg-white">
                                <td class="border px-3 py-2" th:text="${uc.usuario.nombre + ' ' + uc.usuario.primerApellido}">Nombre</td>
                                <td class="border px-2 py-2 text-center" th:text="${uc.activo ? '✔️ Activo' : 'Suplente'}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="/redireccion" 
               class="py-2 px-6 bg-gray-600 text-white font-bold rounded-lg hover:bg-gray-700 shadow-lg transition">
               ← Volver al Menú
            </a>
        </div>
    </div>
</body>
</html>
