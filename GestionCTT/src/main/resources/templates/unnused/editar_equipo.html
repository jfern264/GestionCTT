<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Equipo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">Editar Equipo</h1>

        <form action="/equipos/editar" method="post" class="space-y-4">
            <input type="hidden" name="id" value="${equipo.id}">

            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="${equipo.nombre}" required class="w-full p-2 border border-gray-300 rounded">
            </div>

            <div>
                <label for="categoria" class="block text-sm font-medium text-gray-700">Categoría</label>
                <input type="text" id="categoria" name="categoria" value="${equipo.categoria}" required class="w-full p-2 border border-gray-300 rounded">
            </div>

            <div>
                <label for="liga" class="block text-sm font-medium text-gray-700">Liga</label>
                <input type="text" id="liga" name="liga" value="${equipo.liga}" required class="w-full p-2 border border-gray-300 rounded">
            </div>

            <div>
                <label for="puntos" class="block text-sm font-medium text-gray-700">Puntos</label>
                <input type="number" id="puntos" name="puntos" value="${equipo.puntos}" required class="w-full p-2 border border-gray-300 rounded">
            </div>

            <div>
                <label for="precio" class="block text-sm font-medium text-gray-700">Precio</label>
                <input type="number" step="0.01" id="precio" name="precio" value="${equipo.precio}" required class="w-full p-2 border border-gray-300 rounded">
            </div>

            <div class="flex justify-end">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Guardar Cambios</button>
            </div>
        </form>
    </div>

</body>
</html>
