<!-- fragments/sidebar.html -->
<div th:fragment="sidebar">
    <aside class="sidebar">
        <div class="sidebar-content">
            <!-- PERFIL DE USUARIO -->
            <div class="user-profile-section">
                <a href="/perfil" class="user-profile-link">
                    <div class="user-avatar">

                        <div class="user-avatar-placeholder">
                            <img id="avatarPreview"
                                th:src="${usuario.avatar != null && !usuario.avatar.isEmpty()} 
              ? @{/images/{path}(path=${usuario.avatar})} 
              : 'https://ui-avatars.com/api/?name=' + ${usuario.nombre} + '+' + ${usuario.primerApellido} + '&background=1a4731&color=fff&size=150'"
                                alt="Avatar"
                                class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-white shadow-lg object-cover">

                        </div>

                    </div>

                    <div class="user-info">
                        <div class="user-name"><span th:text="${usuario.nombre}"></span></div>
                        <div class="user-role">
                            <span class="user-role-badge">Full Access</span>
                        </div>
                    </div>

                    <svg class="profile-arrow w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>
            </div>


            <div class="sidebar-menu">
                <a href="/jugadores" class="sidebar-link sidebar-jugadores">
                    <div class="sidebar-icon">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <span>Jugadores</span>
                </a>

                <a href="/usuarios" class="sidebar-link sidebar-usuarios">
                    <div class="sidebar-icon">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                    </div>
                    <span>Usuarios</span>
                </a>

                <a href="/roles" class="sidebar-link sidebar-roles">
                    <div class="sidebar-icon">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                    </div>
                    <span>Roles</span>
                </a>

                <a href="/ligas" class="sidebar-link sidebar-ligas">
                    <div class="sidebar-icon">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                    </div>
                    <span>Ligas</span>
                </a>

                <a href="/equipos" class="sidebar-link sidebar-equipos">
                    <div class="sidebar-icon">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                    </div>
                    <span>Equipos</span>
                </a>

                <a href="/menu_admin/calendario" class="sidebar-link sidebar-calendario">
                    <div class="sidebar-icon">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <span>Calendario</span>
                </a>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-menu">
                <a href="/menu_principal" class="sidebar-link">
                    <div class="sidebar-icon">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                    </div>
                    <span>Inicio</span>
                </a>

                <a href="/logout" class="sidebar-link" style="color: #f87171;">
                    <div class="sidebar-icon">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </div>
                    <span>Cerrar Sesión</span>
                </a>
            </div>


        </div>
    </aside>
</div>
